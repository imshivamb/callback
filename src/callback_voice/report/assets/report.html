<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callback report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d67;
  --hairline: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --caller: #2a78d6;
  --agent: #1baf7a;
  --caller-block: rgba(42, 120, 214, 0.10);
  --agent-block: rgba(27, 175, 122, 0.12);
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --critical: #d03b3b;
  --critical-ink: #b42323;
  --chaos: #b7791f;
  --pin-span: rgba(208, 59, 59, 0.13);
  --playhead: #0b0b0b;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.06), 0 4px 16px rgba(11, 11, 11, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --hairline: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --caller: #3987e5;
    --agent: #199e70;
    --caller-block: rgba(57, 135, 229, 0.16);
    --agent-block: rgba(25, 158, 112, 0.18);
    --good-ink: #0ca30c;
    --warn-ink: #fab219;
    --critical: #e25555;
    --critical-ink: #ff7b7b;
    --chaos: #e0a445;
    --pin-span: rgba(226, 85, 85, 0.20);
    --playhead: #ffffff;
    --focus: #3987e5;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --hairline: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --caller: #3987e5;
  --agent: #199e70;
  --caller-block: rgba(57, 135, 229, 0.16);
  --agent-block: rgba(25, 158, 112, 0.18);
  --good-ink: #0ca30c;
  --warn-ink: #fab219;
  --critical: #e25555;
  --critical-ink: #ff7b7b;
  --chaos: #e0a445;
  --pin-span: rgba(226, 85, 85, 0.20);
  --playhead: #ffffff;
  --focus: #3987e5;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }

/* Verdict header */
.verdict { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 999px; font-weight: 700; letter-spacing: 0.04em;
  color: #fff;
}
.badge.pass { background: var(--good); }
.badge.fail, .badge.error { background: var(--critical); }
.verdict h1 { font-size: 22px; margin: 0; font-weight: 650; }
.meta { margin-top: 6px; display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--muted); }
.toolbar { margin-left: auto; display: flex; gap: 8px; }
.ghost {
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 10px; cursor: pointer; color: var(--ink-2);
}
.ghost:hover { background: var(--surface-2); }

/* Scenario cards */
h2 { font-size: 15px; margin: 28px 0 10px; font-weight: 650; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 12px; }
.aggs td.num, .aggs th { white-space: nowrap; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--shadow);
}
.card header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.card header b { font-size: 14.5px; }
.status { font-weight: 650; white-space: nowrap; }
.status.pass { color: var(--good-ink); }
.status.fail { color: var(--critical-ink); }
.status.warn { color: var(--warn-ink); }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 3px 6px 3px 0; text-align: left; vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--hairline); }
.aggs td { border-bottom: 1px solid var(--hairline); }
.aggs tr:last-child td { border-bottom: 0; }
.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--critical-ink); }
.reasons li { margin: 2px 0; }

/* Calls */
.calls { display: grid; grid-template-columns: 260px 1fr; gap: 12px; align-items: start; }
@media (max-width: 860px) { .calls { grid-template-columns: 1fr; } }
.calllist {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 6px; max-height: 70vh; overflow: auto;
}
.calllist .group { font-size: 12px; color: var(--muted); padding: 8px 8px 4px; }
.callbtn {
  display: flex; width: 100%; gap: 8px; align-items: center; text-align: left;
  padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
}
.callbtn:hover { background: var(--surface-2); }
.callbtn[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--focus); }
.callbtn .count { margin-left: auto; color: var(--muted); font-size: 12px; }
.view {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--shadow); min-width: 0;
}
.view h3 { margin: 0; font-size: 16px; font-weight: 650; }
.transport { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; flex-wrap: wrap; }
.play {
  width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--ink); color: var(--surface); font-size: 14px;
}
.hear { display: inline-flex; align-items: center; gap: 4px; }
.hear button {
  border: 1px solid var(--border); background: transparent; border-radius: 7px;
  padding: 3px 9px; cursor: pointer; color: var(--ink-2);
}
.hear button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.legend { display: flex; gap: 14px; margin-left: auto; color: var(--ink-2); font-size: 12.5px; flex-wrap: wrap; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.canvaswrap { position: relative; }
canvas { display: block; width: 100%; cursor: crosshair; border-radius: 8px; }
canvas.overview { cursor: pointer; margin-bottom: 4px; background: var(--surface-2); }
.tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 340px;
  background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 8px;
  font-size: 12.5px; box-shadow: var(--shadow); display: none;
}
.findings { list-style: none; margin: 10px 0 0; padding: 0; }
.findings li button {
  display: flex; gap: 10px; width: 100%; text-align: left; align-items: baseline;
  border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; cursor: pointer;
}
.findings li button:hover, .findings li button[aria-current="true"] { background: var(--surface-2); }
.findings .when { color: var(--muted); min-width: 64px; }
.pin { font-weight: 700; }
.pin.fail { color: var(--critical-ink); }
.pin.warn { color: var(--warn-ink); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-2); }
.turns td { border-bottom: 1px solid var(--hairline); font-size: 13px; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.error-box {
  border: 1px solid var(--critical); color: var(--critical-ink); border-radius: 8px;
  padding: 8px 10px; margin-top: 10px; white-space: pre-wrap;
}

/* Keyboard help */
dialog {
  border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  color: var(--ink); padding: 18px 20px; box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
kbd {
  font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--border);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--surface-2);
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<audio id="audio" preload="auto"></audio>
<dialog id="help">
  <h3 style="margin-top:0">Keyboard shortcuts</h3>
  <table>
    <tr><td><kbd>Space</kbd></td><td>Play / pause</td></tr>
    <tr><td><kbd>N</kbd> <kbd>P</kbd></td><td>Next / previous failure (plays from just before it)</td></tr>
    <tr><td><kbd>J</kbd> <kbd>K</kbd></td><td>Next / previous call</td></tr>
    <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Back / forward 1 s (<kbd>Shift</kbd>: 5 s)</td></tr>
    <tr><td><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></td><td>Zoom in / out / whole call (or drag the whole-call strip)</td></tr>
    <tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Hear both sides / only the caller / only the agent</td></tr>
    <tr><td><kbd>T</kbd></td><td>Light / dark</td></tr>
    <tr><td><kbd>?</kbd></td><td>This help</td></tr>
  </table>
  <form method="dialog" style="margin-top:12px;text-align:right"><button class="ghost">Close</button></form>
</dialog>
<script id="report-data" type="application/json">/*__CALLBACK_REPORT_DATA__*/null</script>
<script>
// @ts-check
"use strict";

/**
 * @typedef {{metric: string, t_s: number, end_s: number|null, message: string, severity: "fail"|"warn", chaos_id: string|null}} Finding
 * @typedef {{who: "caller"|"agent", start: number, end: number, text: string}} SpeechTurn
 * @typedef {{t: number, end: number|null, type: string, id: string|null, text: string|null, phase: string|null, data: Object<string, unknown>}} ChaosMark
 * @typedef {{t: number, v: number}} LatencyPoint
 * @typedef {{name: string, value: number|null, unit: string, threshold: number|null, comparator: string, passed: boolean|null, method: string}} MetricRow
 * @typedef {{call_id: string, scenario_id: string, trial: number, seed: string, passed: boolean, error: string|null,
 *   failure_reasons: string[], findings: Finding[], review: {check: string, heard: string|null, reason: string, t_s: number|null}[],
 *   metrics: MetricRow[], duration_s?: number, end_reason?: string, chaos?: ChaosMark[], speech?: SpeechTurn[],
 *   latency?: LatencyPoint[], latency_limit?: number|null, remeasured?: boolean,
 *   peaks?: {caller: number[], agent: number[]}, audio_s?: number, audio?: string}} Call
 * @typedef {{name: string, value: number|null, ci_low: number|null, ci_high: number|null, n: number, unit: string,
 *   threshold: number|null, comparator: string, passed: boolean|null}} Aggregate
 * @typedef {{metric: string, baseline: number|null, current: number|null, delta: number|null,
 *   direction: string, regressed: boolean}} Diff
 * @typedef {{scenario_id: string, agent: string, passed: boolean, failure_reasons: string[],
 *   aggregates: Aggregate[], baseline: Diff[], calls: Call[]}} Scenario
 * @typedef {{run: {run_id: string, created_at: string, callback_version: string, git_sha: string|null, mode: string,
 *   duration_s: number, exit_code: number, passed: boolean, baseline_name: string|null}, scenarios: Scenario[]}} RunReport
 */

/** @type {RunReport} */
const DATA = JSON.parse(/** @type {HTMLElement} */ (document.getElementById("report-data")).textContent || "null");
const app = /** @type {HTMLElement} */ (document.getElementById("app"));
const audio = /** @type {HTMLAudioElement} */ (document.getElementById("audio"));
const help = /** @type {HTMLDialogElement} */ (document.getElementById("help"));

/** @type {Call[]} */
const CALLS = DATA.scenarios.flatMap((s) => s.calls);
const PRE_ROLL_S = 0.75;

const state = {
  /** @type {Call|null} */ call: null,
  /** index into the current call's findings, -1 for none */ finding: -1,
  view: { t0: 0, t1: 1 },
  /** @type {number|null} */ raf: null,
};

// ---------- small helpers ----------

/**
 * @param {string} tag
 * @param {Object<string, any>} [attrs]
 * @param {(Node|string|null|undefined|false)[]} [children]
 * @returns {HTMLElement}
 */
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children) if (c !== null && c !== undefined && c !== false) el.append(c);
  return el;
}

/** @param {number|null|undefined} v @param {string} unit */
function fmt(v, unit) {
  if (v === null || v === undefined) return "–";
  if (unit === "s") return `${v.toFixed(2)} s`;
  if (unit === "ratio") {
    const pct = v * 100;
    return `${pct > 0 && pct < 10 && !Number.isInteger(pct) ? pct.toFixed(1) : Math.round(pct)}%`;
  }
  return String(Math.round(v * 1000) / 1000);
}

/** @param {number} t */
function clock(t) {
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, "0")}`;
}

/** @param {string} name */
function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

const METRIC_LABELS = /** @type {Object<string, string>} */ ({
  task_success_rate: "Task success",
  call_pass_rate: "Calls passed",
  response_latency_p95_s: "Response latency p95",
  response_latency_p50_s: "Response latency p50",
  time_to_yield_p95_s: "Time to yield p95",
  talk_over_ratio: "Talk-over",
  false_yields: "False yields",
  silence_reprompt_s: "Silence reprompt",
  entity_fidelity: "Facts correct",
  policy_violations: "Policy violations",
});

const FINDING_LABELS = /** @type {Object<string, string>} */ ({
  response_latency: "Slow answer",
  time_to_yield: "Late to yield",
  talk_over: "Talk-over",
  false_yield: "False yield",
  silence_reprompt: "Silence",
  task_success: "Task",
  entity_fidelity: "Fact",
  policy_violations: "Policy",
});

/** Which failure a call opens on: the one a chaos event caused, else the most telling. */
const FINDING_WEIGHT = /** @type {Object<string, number>} */ ({
  task_success: 0, entity_fidelity: 1, policy_violations: 2, time_to_yield: 3, false_yield: 4,
  silence_reprompt: 5, talk_over: 6, response_latency: 7,
});
/** @param {Call} c */
function primaryFinding(c) {
  let best = -1, bestScore = Infinity;
  c.findings.forEach((f, i) => {
    if (f.severity !== "fail") return;
    const score = (f.chaos_id ? 0 : 100) + (FINDING_WEIGHT[f.metric] ?? 50) + f.t_s / 1e4;
    if (score < bestScore) { best = i; bestScore = score; }
  });
  return best;
}

/** Metric names in a reason → the words people use. @param {string} reason */
function humanize(reason) {
  return reason
    .replace(/\b([a-z_]+_(?:s|ratio|rate|yields|violations|fidelity|success))\b/g, (m) => METRIC_LABELS[m] || FINDING_LABELS[m] || m)
    .replace(/95% CI/g, "95% range");
}

/** A failed across-call number as one sentence. @param {Aggregate} a */
function aggregateReason(a) {
  const label = METRIC_LABELS[a.name] || a.name;
  const side = a.comparator === "<=" ? "over" : "under";
  const range = a.ci_low !== null && a.ci_high !== null ? ` (95% range ${fmt(a.ci_low, a.unit)} – ${fmt(a.ci_high, a.unit)})` : "";
  return `${label} ${fmt(a.value, a.unit)}, ${side} the ${fmt(a.threshold, a.unit)} limit${range}.`;
}

// ---------- header and scenario cards ----------

function renderHeader() {
  const run = DATA.run;
  const word = run.exit_code === 0 ? "PASS" : run.exit_code === 1 ? "FAIL" : "ERROR";
  const cls = run.exit_code === 0 ? "pass" : run.exit_code === 1 ? "fail" : "error";
  const passedScenarios = DATA.scenarios.filter((s) => s.passed).length;
  const regressions = DATA.scenarios.flatMap((s) => s.baseline).filter((d) => d.regressed).length;
  const calls = CALLS.length;
  const passedCalls = CALLS.filter((c) => c.passed).length;
  const headline = [
    `${passedScenarios} of ${DATA.scenarios.length} scenario${DATA.scenarios.length === 1 ? "" : "s"} passed`,
    `${passedCalls} of ${calls} call${calls === 1 ? "" : "s"} passed`,
    run.baseline_name ? `${regressions} regression${regressions === 1 ? "" : "s"} vs ${run.baseline_name}` : null,
  ].filter(Boolean).join(" · ");
  const when = new Date(run.created_at);
  return h("header", {}, [
    h("div", { class: "verdict" }, [
      h("span", { class: `badge ${cls}`, role: "status" }, [word === "PASS" ? "✓ PASS" : word === "FAIL" ? "✕ FAIL" : "! ERROR"]),
      h("h1", {}, [headline]),
      h("div", { class: "toolbar" }, [
        h("button", { class: "ghost", onclick: toggleTheme, title: "Light / dark (T)" }, ["◐ Theme"]),
        h("button", { class: "ghost", onclick: () => help.showModal(), title: "Keyboard shortcuts (?)" }, ["⌨ Keys"]),
      ]),
    ]),
    h("div", { class: "meta num" }, [
      h("span", {}, [`run ${run.run_id}`]),
      h("span", {}, [when.toLocaleString()]),
      h("span", {}, [`exit ${run.exit_code}`]),
      h("span", {}, [`${Math.round(run.duration_s)} s`]),
      run.git_sha ? h("span", { class: "mono" }, [run.git_sha.slice(0, 7)]) : null,
      h("span", {}, [`callback ${run.callback_version}`]),
      h("span", {}, [`caller ${run.mode}`]),
    ]),
  ]);
}

/** @param {Scenario} s */
function renderCard(s) {
  const regressed = s.baseline.some((d) => d.regressed);
  const ok = s.passed && !regressed;
  const diffs = new Map(s.baseline.map((d) => [d.metric, d]));
  const rows = s.aggregates.map((a) => {
    const d = diffs.get(a.name);
    const mark = a.passed === null ? h("span", { class: "muted", title: "No limit: shown for information" }, ["–"])
      : a.passed ? h("span", { class: "status pass" }, ["✓"]) : h("span", { class: "status fail" }, ["✕ over"]);
    const range = a.ci_low !== null && a.ci_high !== null ? `${fmt(a.ci_low, a.unit)} – ${fmt(a.ci_high, a.unit)}` : "";
    const limit = a.threshold !== null ? `${a.comparator === "<=" ? "≤" : "≥"} ${fmt(a.threshold, a.unit)}` : "";
    return h("tr", {}, [
      h("td", {}, [METRIC_LABELS[a.name] || a.name]),
      h("td", { class: "num" }, [h("b", {}, [fmt(a.value, a.unit)])]),
      h("td", { class: "num muted" }, [range]),
      h("td", { class: "num muted" }, [limit]),
      h("td", {}, [mark]),
      h("td", { class: "num" }, [d ? renderDiff(d, a.unit) : ""]),
    ]);
  });
  return h("article", { class: "card" }, [
    h("header", {}, [
      h("span", { class: `status ${ok ? "pass" : "fail"}` }, [ok ? "✓ Pass" : regressed && s.passed ? "✕ Regressed" : "✕ Fail"]),
      h("b", {}, [s.scenario_id]),
      h("span", { class: "muted" }, [`${s.agent} · ${s.calls.length} call${s.calls.length === 1 ? "" : "s"}`]),
    ]),
    !rows.length ? h("p", { class: "muted" }, ["No across-call numbers: this run was made by an older Callback."]) : h("table", { class: "aggs" }, [
      h("thead", {}, [h("tr", {}, [
        h("th", {}, ["Across calls"]), h("th", {}, ["Value"]), h("th", {}, ["95% range"]),
        h("th", {}, ["Limit"]), h("th", {}, [""]), h("th", {}, [DATA.run.baseline_name ? `vs ${DATA.run.baseline_name}` : ""]),
      ])]),
      h("tbody", {}, rows),
    ]),
    cardReasons(s),
  ]);
}

/** Failed across-call numbers from the data, then failures no number covers. @param {Scenario} s */
function cardReasons(s) {
  const fromAggregates = s.aggregates.filter((a) => a.passed === false).map(aggregateReason);
  const regressions = s.baseline.filter((d) => d.regressed).map((d) => {
    const unit = s.aggregates.find((a) => a.name === d.metric)?.unit || "";
    return `${METRIC_LABELS[d.metric] || d.metric} regressed: ${fmt(d.baseline, unit)} → ${fmt(d.current, unit)} against ${DATA.run.baseline_name}.`;
  });
  const other = s.failure_reasons.filter((r) => !s.aggregates.length || /^trial \d+:/.test(r)).map(humanize);
  const all = [...fromAggregates, ...regressions, ...other];
  return all.length ? h("ul", { class: "reasons" }, all.map((r) => h("li", {}, [r]))) : null;
}

/** @param {Diff} d @param {string} unit */
function renderDiff(d, unit) {
  if (d.delta === null) return h("span", { class: "muted" }, [d.direction]);
  const arrow = d.direction === "same" ? "=" : d.delta > 0 ? "▲" : "▼";
  const sign = d.delta > 0 ? "+" : d.delta < 0 ? "−" : "±";
  const text = `${arrow} ${sign}${fmt(Math.abs(d.delta), unit)}`;
  if (d.regressed) return h("span", { class: "status fail", title: `was ${fmt(d.baseline, unit)}; beyond noise` }, [`${text} regressed`]);
  const cls = d.direction === "better" ? "status pass" : "muted";
  const word = d.direction === "worse" ? " (noise)" : "";
  return h("span", { class: cls, title: `was ${fmt(d.baseline, unit)}` }, [text + word]);
}

// ---------- call list and call view ----------

/** @param {Call} c */
function callMark(c) {
  if (c.error) return h("span", { class: "status fail", "aria-label": "error" }, ["!"]);
  return c.passed ? h("span", { class: "status pass", "aria-label": "passed" }, ["✓"]) : h("span", { class: "status fail", "aria-label": "failed" }, ["✕"]);
}

function renderCallList() {
  const list = h("nav", { class: "calllist", "aria-label": "Calls" });
  for (const s of DATA.scenarios) {
    list.append(h("div", { class: "group" }, [s.scenario_id]));
    for (const c of s.calls) {
      const fails = c.findings.filter((f) => f.severity === "fail").length;
      list.append(h("button", {
        class: "callbtn", "data-call": c.call_id, onclick: () => selectCall(c, true),
      }, [callMark(c), `Trial ${c.trial}`, h("span", { class: "count" }, [fails ? `${fails} pin${fails === 1 ? "" : "s"}` : ""])]));
    }
  }
  return list;
}

const canvas = /** @type {HTMLCanvasElement} */ (h("canvas", { role: "img", tabindex: "0" }));
const overview = /** @type {HTMLCanvasElement} */ (h("canvas", { class: "overview", "aria-label": "Whole call: click to move the timeline window" }));
const tip = h("div", { class: "tip", role: "tooltip" });
const viewEl = h("section", { class: "view", "aria-live": "polite" });

/** @param {Call} c @param {boolean} [focus] */
function selectCall(c, focus = false) {
  audio.pause();
  state.call = c;
  const firstFail = primaryFinding(c);
  state.finding = firstFail;
  const total = c.audio_s || c.duration_s || 1;
  state.view = firstFail >= 0 ? around(c.findings[firstFail].t_s, total) : { t0: 0, t1: total };
  if (c.audio) audio.src = c.audio; else audio.removeAttribute("src");
  if (firstFail >= 0) audio.currentTime = Math.max(0, c.findings[firstFail].t_s - PRE_ROLL_S);
  for (const b of document.querySelectorAll(".callbtn")) b.setAttribute("aria-current", String(b.getAttribute("data-call") === c.call_id));
  try { history.replaceState(null, "", `#${encodeURIComponent(c.call_id)}`); } catch { /* file: URLs may refuse */ }
  renderView();
  if (focus) canvas.focus();
}

function renderView() {
  const c = state.call;
  if (!c) return;
  const playBtn = h("button", { class: "play", id: "play", onclick: togglePlay, "aria-label": "Play", title: "Play / pause (Space)" }, ["▶"]);
  const legend = h("div", { class: "legend" }, [
    h("span", { class: "key" }, [h("span", { class: "swatch", style: `background:${css("--caller")}` }), "Caller (left channel)"]),
    h("span", { class: "key" }, [h("span", { class: "swatch", style: `background:${css("--agent")}` }), "Agent (right channel)"]),
    h("span", { class: "key" }, [h("span", { class: "pin fail" }, ["▼"]), "Failure"]),
    h("span", { class: "key" }, [h("span", { style: `color:${css("--chaos")}` }, ["◆"]), "Chaos"]),
  ]);
  const findings = h("ul", { class: "findings", "aria-label": "Failures in this call" },
    c.findings.map((f, i) => h("li", {}, [h("button", {
      "aria-current": String(i === state.finding), onclick: () => jumpTo(i, true),
    }, [
      h("span", { class: "when num" }, [`▶ ${clock(f.t_s)}`]),
      h("span", { class: `pin ${f.severity}` }, [f.severity === "fail" ? "✕" : "▲"]),
      h("span", { class: "muted" }, [FINDING_LABELS[f.metric] || f.metric]),
      h("span", {}, [f.message]),
    ])])));
  const meta = [
    `trial ${c.trial}`, c.call_id,
    c.duration_s !== undefined ? `${c.duration_s.toFixed(1)} s` : null,
    c.end_reason ? `ended: ${c.end_reason.replace(/_/g, " ")}` : null,
    `seed ${c.seed}`,
  ].filter(Boolean).join(" · ");
  viewEl.replaceChildren(...[
    h("h3", {}, [callMark(c), " ", c.scenario_id]),
    h("div", { class: "muted num" }, [meta]),
    c.error ? h("div", { class: "error-box" }, [c.error]) : null,
    c.peaks ? h("div", { class: "transport" }, [
      playBtn,
      h("span", { class: "num", id: "time" }, [`${clock(audio.currentTime || 0)} / ${clock(c.audio_s || 0)}`]),
      c.audio ? h("div", { class: "hear", role: "group", "aria-label": "Hear" }, [
        h("span", { class: "muted" }, ["Hear"]),
        ...(/** @type {const} */ (["both", "caller", "agent"])).map((side, k) => h("button", {
          "data-side": side, "aria-pressed": String(hear === side), title: `${k + 1}`,
          onclick: () => setHear(side),
        }, [side === "both" ? "Both" : side === "caller" ? "Caller" : "Agent"])),
      ]) : h("span", { class: "muted" }, ["(audio not embedded)"]),
      legend,
    ]) : null,
    c.peaks ? h("div", { class: "canvaswrap" }, [overview, canvas, tip]) : h("p", { class: "muted" }, ["No recording for this call."]),
    c.findings.length ? findings : h("p", { class: "muted" }, [c.passed ? "No failures in this call." : ""]),
    !c.findings.length && c.failure_reasons.length ? h("ul", { class: "reasons" }, c.failure_reasons.map((r) => h("li", {}, [humanize(r)]))) : null,
    c.remeasured ? h("p", { class: "note" }, ["Speech timings for this older run were re-measured from the recording with the same scorer."]) : null,
    renderTurnsTable(c),
  ].filter((n) => n !== null));
  canvas.setAttribute("aria-label", `Timeline of ${c.call_id}: ${c.findings.length} findings. Use N and P to move between failures, Space to play.`);
  requestAnimationFrame(draw);
}

/** @param {Call} c */
function renderTurnsTable(c) {
  if (!c.speech || !c.speech.length) return null;
  const rows = c.speech.map((t) => h("tr", {}, [
    h("td", { class: "num" }, [clock(t.start)]),
    h("td", { class: "num muted" }, [`${(t.end - t.start).toFixed(2)} s`]),
    h("td", {}, [t.who === "caller" ? "Caller" : "Agent"]),
    h("td", {}, [t.text || h("span", { class: "muted" }, ["(not transcribed)"])]),
  ]));
  return h("details", {}, [
    h("summary", {}, ["Speech and timings as a table"]),
    h("table", { class: "turns" }, [h("thead", {}, [h("tr", {}, [h("th", {}, ["Start"]), h("th", {}, ["Length"]), h("th", {}, ["Who"]), h("th", {}, ["Said"])])]), h("tbody", {}, rows)]),
  ]);
}

// ---------- the timeline canvas ----------

const LAYOUT = { axis: 22, chaos: 18, pins: 30, lane: 64, gap: 6, strip: 56, pad: 10 };
/** @type {{x0: number, x1: number}} */
let geom = { x0: 0, x1: 0 };
/** @type {{x: number, y: number, r: number, text: string, t: number, pin?: number}[]} */
let hits = [];

/**
 * Size a canvas for the device pixel ratio and return its 2D context.
 * @param {HTMLCanvasElement} cv @param {number} height
 */
function prepare(cv, height) {
  const dpr = window.devicePixelRatio || 1;
  const width = cv.clientWidth || 800;
  if (cv.width !== Math.round(width * dpr) || cv.height !== Math.round(height * dpr)) {
    cv.width = Math.round(width * dpr);
    cv.height = Math.round(height * dpr);
    cv.style.height = `${height}px`;
  }
  const g = /** @type {CanvasRenderingContext2D} */ (cv.getContext("2d"));
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, width, height);
  g.font = "12px system-ui, -apple-system, Segoe UI, sans-serif";
  g.textBaseline = "middle";
  return { g, width };
}

function draw() {
  const c = state.call;
  if (!c || !c.peaks || !canvas.isConnected) return;
  drawOverview(c);
  const L = LAYOUT;
  const { g, width } = prepare(canvas, L.axis + L.chaos + L.pins + 2 * L.lane + L.gap + 16 + L.strip + L.pad);
  hits = [];

  const x0 = 64, x1 = width - 12;
  const { t0, t1 } = state.view;
  /** @param {number} t */
  const X = (t) => x0 + ((t - t0) / (t1 - t0)) * (x1 - x0);
  const yChaos = L.axis;
  const yPins = yChaos + L.chaos;
  const yCaller = yPins + L.pins;
  const yAgent = yCaller + L.lane + L.gap;
  const yStrip = yAgent + L.lane + 16;
  geom = { x0, x1 };

  // time axis
  const span = t1 - t0;
  const step = [0.5, 1, 2, 5, 10, 15, 30, 60].find((s) => span / s <= 12) || 120;
  g.fillStyle = css("--muted");
  g.strokeStyle = css("--hairline");
  g.lineWidth = 1;
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    const x = Math.round(X(t)) + 0.5;
    g.beginPath(); g.moveTo(x, L.axis - 4); g.lineTo(x, yStrip + L.strip); g.stroke();
    g.textAlign = "center";
    g.fillText(clock(t).replace(/\.0$/, ""), x, 9);
  }

  // lane labels (direct labels: identity is never colour alone)
  g.textAlign = "left";
  g.fillStyle = css("--ink-2");
  g.fillText("Caller", 8, yCaller + L.lane / 2);
  g.fillText("Agent", 8, yAgent + L.lane / 2);
  g.fillStyle = css("--muted");
  g.fillText("Chaos", 8, yChaos + L.chaos / 2);
  g.fillText("Failures", 8, yPins + L.pins / 2);
  g.fillText("Latency", 8, yStrip + L.strip - 7);

  // the selected failure's span, behind everything
  const sel = state.finding >= 0 ? c.findings[state.finding] : null;
  if (sel && sel.end_s !== null && sel.end_s > sel.t_s) {
    g.fillStyle = css("--pin-span");
    const a = Math.max(x0, X(sel.t_s)), b = Math.min(x1, X(sel.end_s));
    if (b > a) g.fillRect(a, yCaller, Math.max(2, b - a), yAgent + L.lane - yCaller);
  }

  // turn blocks behind the waveforms
  for (const t of c.speech || []) {
    if (t.end < t0 || t.start > t1) continue;
    const y = t.who === "caller" ? yCaller : yAgent;
    g.fillStyle = css(t.who === "caller" ? "--caller-block" : "--agent-block");
    const a = Math.max(x0, X(t.start)), b = Math.min(x1, X(t.end));
    roundRect(g, a, y, Math.max(2, b - a), L.lane, 4);
    g.fill();
    const who = t.who === "caller" ? "Caller" : "Agent";
    const label = t.text ? `${who}: “${t.text}”` : `${who} speaking`;
    hits.push({ x: (a + b) / 2, y: y + L.lane / 2, r: Math.max(6, (b - a) / 2), text: `${label} (${clock(t.start)}–${clock(t.end)})`, t: t.start });
  }

  // waveforms, mirrored around each lane's centre
  drawWave(g, c.peaks.caller, c.audio_s || 1, yCaller, L.lane, css("--caller"), X, x0, x1);
  drawWave(g, c.peaks.agent, c.audio_s || 1, yAgent, L.lane, css("--agent"), X, x0, x1);

  // chaos markers
  g.fillStyle = css("--chaos");
  g.strokeStyle = css("--chaos");
  for (const m of c.chaos || []) {
    if (m.t < t0 || m.t > t1) continue;
    const x = X(m.t);
    g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(x, yChaos + L.chaos - 2); g.lineTo(x, yAgent + L.lane); g.stroke();
    g.setLineDash([]);
    diamond(g, x, yChaos + L.chaos / 2, 5);
    const detail = m.text ? `: “${m.text}”` : m.phase ? ` (${m.phase})` : "";
    hits.push({ x, y: yChaos + L.chaos / 2, r: 9, text: `Chaos · ${m.type.replace(/_/g, " ")}${detail} at ${clock(m.t)}`, t: m.t });
  }

  // latency strip: one bar per answered caller turn, against the limit
  const pts = c.latency || [];
  const limit = c.latency_limit || null;
  const vmax = Math.max(limit ? limit * 1.4 : 0, ...pts.map((p) => p.v), 0.5);
  const barW = Math.max(6, Math.min(12, (x1 - x0) / (span * 2)));
  g.strokeStyle = css("--axis");
  g.beginPath(); g.moveTo(x0, yStrip + L.strip + 0.5); g.lineTo(x1, yStrip + L.strip + 0.5); g.stroke();
  for (const p of pts) {
    if (p.t < t0 || p.t > t1) continue;
    const hgt = (p.v / vmax) * (L.strip - 4);
    const over = limit !== null && p.v > limit;
    g.fillStyle = over ? css("--critical") : css("--agent");
    roundTop(g, X(p.t) - barW / 2, yStrip + L.strip - hgt, barW, hgt, 3);
    g.fill();
    if (span <= 30) {
      g.fillStyle = css("--ink-2");
      g.textAlign = "left";
      g.fillText(`${p.v.toFixed(2)} s`, X(p.t) + barW / 2 + 4, yStrip + L.strip - hgt + 6);
    }
    hits.push({ x: X(p.t), y: yStrip + L.strip - hgt / 2, r: Math.max(8, hgt / 2), text: `Answered after ${p.v.toFixed(2)} s${over ? ` (limit ${limit} s)` : ""} at ${clock(p.t)}`, t: p.t });
  }
  if (limit !== null) {
    const y = Math.round(yStrip + L.strip - (limit / vmax) * (L.strip - 4)) + 0.5;
    g.strokeStyle = css("--critical");
    g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.setLineDash([]);
    g.fillStyle = css("--critical-ink");
    g.textAlign = "right";
    g.fillText(`≤ ${limit} s`, x0 - 6, y);
  }

  // failure pins in their own row, stacked when they would touch
  /** @type {number[][]} x positions already used per stack level */
  const levels = [[], [], []];
  const order = c.findings.map((f, i) => i).filter((i) => c.findings[i].t_s >= t0 && c.findings[i].t_s <= t1)
    .sort((a, b) => (a === state.finding ? -1 : b === state.finding ? 1 : c.findings[a].t_s - c.findings[b].t_s));
  for (const i of order) {
    const f = c.findings[i];
    const x = X(f.t_s);
    const active = i === state.finding;
    let level = levels.findIndex((xs) => xs.every((u) => Math.abs(u - x) >= 15));
    if (level < 0) level = levels.length - 1;
    levels[level].push(x);
    const col = css(f.severity === "fail" ? "--critical" : "--warn");
    const tip = yPins + L.pins - 1 - level * 9;
    g.strokeStyle = col;
    g.globalAlpha = active ? 1 : 0.55;
    g.lineWidth = active ? 2 : 1;
    g.beginPath(); g.moveTo(x, tip); g.lineTo(x, yAgent + L.lane); g.stroke();
    g.globalAlpha = 1;
    g.lineWidth = 1;
    pin(g, x, tip, col, active);
    hits.push({ x, y: tip - 6, r: 10, text: f.message, t: f.t_s, pin: i });
  }

  // playhead
  const now = audio.currentTime || 0;
  if (now >= t0 && now <= t1) {
    const x = Math.round(X(now)) + 0.5;
    g.strokeStyle = css("--playhead");
    g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, L.axis - 6); g.lineTo(x, yStrip + L.strip); g.stroke();
    g.lineWidth = 1;
  }
  const timeEl = document.getElementById("time");
  if (timeEl) timeEl.textContent = `${clock(now)} / ${clock(c.audio_s || 0)}`;
}

/**
 * The whole call in one thin strip: speech, failures, chaos, and the window the
 * timeline shows. Click or drag it to move the window.
 * @param {Call} c
 */
function drawOverview(c) {
  const total = c.audio_s || c.duration_s || 1;
  const { g, width } = prepare(overview, 30);
  const x0 = 64, x1 = width - 12;
  /** @param {number} t */
  const X = (t) => x0 + (t / total) * (x1 - x0);
  g.fillStyle = css("--muted");
  g.textAlign = "left";
  g.fillText("Call", 8, 15);
  for (const t of c.speech || []) {
    g.fillStyle = css(t.who === "caller" ? "--caller" : "--agent");
    g.fillRect(X(t.start), t.who === "caller" ? 9 : 17, Math.max(1, X(t.end) - X(t.start)), 5);
  }
  g.fillStyle = css("--chaos");
  for (const m of c.chaos || []) diamond(g, X(m.t), 4, 3);
  c.findings.forEach((f, i) => {
    g.fillStyle = css(f.severity === "fail" ? "--critical" : "--warn");
    g.fillRect(X(f.t_s) - (i === state.finding ? 1.5 : 1), 24, i === state.finding ? 3 : 2, 6);
  });
  const { t0, t1 } = state.view;
  if (t0 > 0 || t1 < total) {
    g.strokeStyle = css("--ink-2");
    g.lineWidth = 1.5;
    roundRect(g, X(t0), 1, Math.max(4, X(t1) - X(t0)), 28, 4);
    g.stroke();
    g.lineWidth = 1;
  }
  const now = audio.currentTime || 0;
  g.fillStyle = css("--playhead");
  g.fillRect(X(now) - 0.75, 0, 1.5, 30);
}

/**
 * @param {CanvasRenderingContext2D} g @param {number[]} peaks @param {number} total
 * @param {number} y @param {number} hgt @param {string} color
 * @param {(t: number) => number} X @param {number} x0 @param {number} x1
 */
function drawWave(g, peaks, total, y, hgt, color, X, x0, x1) {
  const mid = y + hgt / 2;
  const per = total / peaks.length;
  g.fillStyle = color;
  const { t0, t1 } = state.view;
  const i0 = Math.max(0, Math.floor(t0 / per));
  const i1 = Math.min(peaks.length - 1, Math.ceil(t1 / per));
  const pxPer = (x1 - x0) / ((t1 - t0) / per);
  const stride = Math.max(1, Math.floor(1.5 / pxPer));
  for (let i = i0; i <= i1; i += stride) {
    let p = 0;
    for (let k = i; k < i + stride && k < peaks.length; k++) p = Math.max(p, peaks[k]);
    const a = (p / 100) * (hgt / 2 - 2);
    const x = X(i * per);
    g.fillRect(x, mid - Math.max(0.5, a), Math.max(1, pxPer * stride - 0.5), Math.max(1, 2 * a));
  }
}

/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} w @param {number} hh @param {number} r */
function roundRect(g, x, y, w, hh, r) {
  g.beginPath();
  g.roundRect(x, y, w, hh, Math.min(r, w / 2));
}
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} w @param {number} hh @param {number} r */
function roundTop(g, x, y, w, hh, r) {
  g.beginPath();
  g.roundRect(x, y, w, Math.max(1, hh), [Math.min(r, hh), Math.min(r, hh), 0, 0]);
}
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} r */
function diamond(g, x, y, r) {
  g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill();
}
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {string} col @param {boolean} active */
function pin(g, x, y, col, active) {
  const r = active ? 7 : 5.5;
  g.fillStyle = col;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x - r, y - r * 1.6); g.lineTo(x + r, y - r * 1.6); g.closePath(); g.fill();
  g.strokeStyle = css("--surface");
  g.lineWidth = 1.5;
  g.stroke();
  g.lineWidth = 1;
}

// ---------- interaction ----------

/** @param {MouseEvent} e */
function timeAt(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const f = (x - geom.x0) / (geom.x1 - geom.x0);
  return state.view.t0 + Math.min(1, Math.max(0, f)) * (state.view.t1 - state.view.t0);
}

canvas.addEventListener("click", (e) => {
  if (!state.call || !state.call.audio) return;
  const rect = canvas.getBoundingClientRect();
  const hit = nearestHit(e.clientX - rect.left, e.clientY - rect.top);
  if (hit && hit.pin !== undefined) { jumpTo(hit.pin, true); return; }
  const t = hit && hit.r <= 10 ? hit.t : timeAt(e);
  audio.currentTime = Math.max(0, t - (hit && hit.r <= 10 ? PRE_ROLL_S : 0));
  audio.play();
});

canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hit = nearestHit(x, y);
  if (!hit) { tip.style.display = "none"; return; }
  tip.textContent = hit.text;
  tip.style.display = "block";
  const left = Math.min(rect.width - tip.offsetWidth - 4, Math.max(4, x + 12));
  tip.style.left = `${left}px`;
  tip.style.top = `${Math.max(0, y - tip.offsetHeight - 10)}px`;
});
canvas.addEventListener("mouseleave", () => { tip.style.display = "none"; });

/** @param {MouseEvent} e */
function moveWindow(e) {
  const c = state.call;
  if (!c) return;
  const total = c.audio_s || c.duration_s || 1;
  const rect = overview.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - rect.left - 64) / (rect.width - 76)));
  const span = state.view.t1 - state.view.t0;
  if (span >= total) state.view = around(f * total, total);
  const t0 = Math.min(Math.max(0, f * total - span / 2), total - (state.view.t1 - state.view.t0));
  state.view = { t0, t1: t0 + (state.view.t1 - state.view.t0) };
  draw();
}
overview.addEventListener("mousedown", (e) => {
  moveWindow(e);
  /** @param {MouseEvent} ev */
  const move = (ev) => moveWindow(ev);
  const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

canvas.addEventListener("wheel", (e) => {
  if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoom(e.deltaY > 0 ? 1.25 : 0.8, timeAt(e));
  else pan(e.deltaX / canvas.clientWidth * (state.view.t1 - state.view.t0));
}, { passive: false });

/** @param {number} x @param {number} y */
function nearestHit(x, y) {
  let best = null, bestD = Infinity;
  for (const hit of hits) {
    const d = Math.hypot(hit.x - x, (hit.y - y) * 1.6);
    const reach = hit.r <= 10 ? 14 : hit.r;
    if (d <= reach && (hit.r <= 10 ? d : d + 20) < bestD) { best = hit; bestD = hit.r <= 10 ? d : d + 20; }
  }
  return best;
}

const FOCUS_SPAN_S = 14;
/** A window of FOCUS_SPAN_S around t, a third of the way in. @param {number} t @param {number} total */
function around(t, total) {
  if (total <= FOCUS_SPAN_S * 1.5) return { t0: 0, t1: total };
  const t0 = Math.min(Math.max(0, t - FOCUS_SPAN_S / 3), total - FOCUS_SPAN_S);
  return { t0, t1: t0 + FOCUS_SPAN_S };
}

/** @param {number} factor @param {number} [centreAt] */
function zoom(factor, centreAt) {
  const c = state.call;
  if (!c) return;
  const total = c.audio_s || c.duration_s || 1;
  const { t0, t1 } = state.view;
  const centre = centreAt ?? (audio.currentTime || (t0 + t1) / 2);
  const span = Math.min(total, Math.max(2, (t1 - t0) * factor));
  let a = centre - (centre - t0) * (span / (t1 - t0));
  a = Math.min(Math.max(0, a), total - span);
  state.view = { t0: a, t1: a + span };
  draw();
}

/** @param {number} dt */
function pan(dt) {
  const c = state.call;
  if (!c) return;
  const total = c.audio_s || c.duration_s || 1;
  const span = state.view.t1 - state.view.t0;
  const a = Math.min(Math.max(0, state.view.t0 + dt), total - span);
  state.view = { t0: a, t1: a + span };
  draw();
}

// ---------- hear one side ----------

/** @type {"both"|"caller"|"agent"} */
let hear = "both";
/** @type {{ctx: AudioContext, gains: GainNode[]}|null} */
let graph = null;

/**
 * Route the stereo recording: both sides as recorded, or one side in both ears.
 * Built on first use, because browsers only start audio after a user gesture.
 */
function route() {
  if (!graph) {
    const Ctx = window.AudioContext || /** @type {any} */ (window).webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const source = ctx.createMediaElementSource(audio);
    const split = ctx.createChannelSplitter(2);
    const merge = ctx.createChannelMerger(2);
    source.connect(split);
    // gains: caller→left, caller→right, agent→left, agent→right
    const gains = [0, 1, 0, 1].map((out, k) => {
      const gain = ctx.createGain();
      split.connect(gain, k < 2 ? 0 : 1);
      gain.connect(merge, 0, out);
      return gain;
    });
    merge.connect(ctx.destination);
    graph = { ctx, gains };
  }
  const levels = hear === "both" ? [1, 0, 0, 1] : hear === "caller" ? [1, 1, 0, 0] : [0, 0, 1, 1];
  graph.gains.forEach((gain, k) => { gain.gain.value = levels[k]; });
  if (graph.ctx.state === "suspended") graph.ctx.resume();
}

/** @param {"both"|"caller"|"agent"} side */
function setHear(side) {
  hear = side;
  for (const b of document.querySelectorAll(".hear button")) b.setAttribute("aria-pressed", String(b.getAttribute("data-side") === side));
  if (graph || side !== "both") route();
}

function togglePlay() {
  if (!state.call || !state.call.audio) return;
  if (audio.paused) audio.play(); else audio.pause();
}

/** @param {number} i @param {boolean} play */
function jumpTo(i, play) {
  const c = state.call;
  if (!c || i < 0 || i >= c.findings.length) return;
  state.finding = i;
  const f = c.findings[i];
  audio.currentTime = Math.max(0, f.t_s - PRE_ROLL_S);
  state.view = around(f.t_s, c.audio_s || c.duration_s || 1);
  for (const [k, b] of document.querySelectorAll(".findings button").entries()) b.setAttribute("aria-current", String(k === i));
  if (play && c.audio) audio.play();
  draw();
}

/** @param {number} dir */
function nextFailure(dir) {
  const c = state.call;
  if (!c || !c.findings.length) return;
  const n = c.findings.length;
  jumpTo(state.finding < 0 ? (dir > 0 ? 0 : n - 1) : (state.finding + dir + n) % n, true);
}

/** @param {number} dir */
function nextCall(dir) {
  const i = CALLS.indexOf(/** @type {Call} */ (state.call));
  const next = CALLS[(i + dir + CALLS.length) % CALLS.length];
  if (next) selectCall(next);
  const btn = document.querySelector(`.callbtn[data-call="${CSS.escape(next.call_id)}"]`);
  if (btn) btn.scrollIntoView({ block: "nearest" });
}

function tick() {
  draw();
  const c = state.call;
  if (c && !audio.paused) {
    const { t0, t1 } = state.view;
    const now = audio.currentTime;
    if (now > t1 - (t1 - t0) * 0.05) pan(now - t0 - (t1 - t0) * 0.1);
    state.raf = requestAnimationFrame(tick);
  } else state.raf = null;
}
audio.addEventListener("play", () => {
  if (hear !== "both" || graph) route();
  const b = document.getElementById("play");
  if (b) { b.textContent = "❚❚"; b.setAttribute("aria-label", "Pause"); }
  if (state.raf === null) state.raf = requestAnimationFrame(tick);
});
audio.addEventListener("pause", () => {
  const b = document.getElementById("play");
  if (b) { b.textContent = "▶"; b.setAttribute("aria-label", "Play"); }
  draw();
});
audio.addEventListener("seeked", () => draw());

document.addEventListener("keydown", (e) => {
  const target = /** @type {HTMLElement} */ (e.target);
  if (e.metaKey || e.ctrlKey || e.altKey || ["INPUT", "TEXTAREA"].includes(target.tagName)) return;
  if (help.open && e.key !== "?") return;
  const k = e.key;
  if (k === " " && target.tagName !== "BUTTON") { e.preventDefault(); togglePlay(); }
  else if (k === "n" || k === "N") nextFailure(1);
  else if (k === "p" || k === "P") nextFailure(-1);
  else if (k === "j" || k === "J") nextCall(1);
  else if (k === "k" || k === "K") nextCall(-1);
  else if (k === "ArrowRight" || k === "ArrowLeft") {
    e.preventDefault();
    audio.currentTime = Math.max(0, (audio.currentTime || 0) + (k === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 5 : 1));
    draw();
  }
  else if (k === "+" || k === "=") zoom(0.66);
  else if (k === "-" || k === "_") zoom(1.5);
  else if (k === "0") { const c = state.call; if (c) { state.view = { t0: 0, t1: c.audio_s || c.duration_s || 1 }; draw(); } }
  else if (k === "t" || k === "T") toggleTheme();
  else if (k === "1") setHear("both");
  else if (k === "2") setHear("caller");
  else if (k === "3") setHear("agent");
  else if (k === "?") { if (help.open) help.close(); else help.showModal(); }
});

// ---------- theme ----------

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("callback-report-theme", root.dataset.theme); } catch { /* storage may be blocked */ }
  renderView();
}
try {
  const saved = localStorage.getItem("callback-report-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
} catch { /* storage may be blocked */ }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderView());
window.addEventListener("resize", () => draw());

// ---------- start ----------

document.title = `${DATA.run.exit_code === 0 ? "PASS" : DATA.run.exit_code === 1 ? "FAIL" : "ERROR"} · Callback run ${DATA.run.run_id}`;
app.append(
  renderHeader(),
  h("h2", {}, ["Scenarios"]),
  h("div", { class: "cards" }, DATA.scenarios.map(renderCard)),
  h("h2", {}, ["Calls ", h("span", { class: "muted", style: "font-weight:400" }, ["· the first failing call is open; press N to hear its next failure, ? for keys"])]),
  h("div", { class: "calls" }, [renderCallList(), viewEl]),
);
const linked = CALLS.find((c) => `#${c.call_id}` === decodeURIComponent(location.hash));
const first = linked || CALLS.find((c) => c.error || !c.passed) || CALLS[0];
if (first) selectCall(first);
</script>
</body>
</html>
