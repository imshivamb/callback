<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callback report</title>
<style>
@font-face {
  font-family: "Callback Display"; font-style: normal; font-weight: 560 760; font-display: swap;
  src: url("data:font/woff2;base64,/*__CALLBACK_FONT__*/") format("woff2");
}
:root {
  color-scheme: light;
  --display: "Callback Display", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --paper: #f3f4f8;
  --card: #ffffff;
  --sunk: #eceef5;
  --ink: #12142b;
  --ink-2: #444a66;
  --quiet: #6a7090;
  --line: #e1e4ee;
  --line-2: #c9cee0;
  --caller: #3b3be6;
  --agent: #00a58e;
  --caller-block: rgba(59, 59, 230, 0.09);
  --agent-block: rgba(0, 165, 142, 0.11);
  --over: #e39a00;
  --over-ink: #8f5600;
  --over-soft: rgba(227, 154, 0, 0.14);
  --error: #d23b3b;
  --error-ink: #a82727;
  --error-soft: rgba(210, 59, 59, 0.1);
  --warn: #7a8099;
  --warn-ink: #444a66;
  --chaos: #c93a96;
  --pass: #12a150;
  --pass-ink: #0b7a3b;
  --focus: #3b3be6;
  --shadow: 0 1px 2px rgba(18, 20, 43, 0.05), 0 12px 32px rgba(18, 20, 43, 0.07);
  /* names the timeline canvas reads */
  --page: var(--paper); --surface: var(--card); --surface-2: var(--sunk);
  --hairline: var(--line); --axis: #c4c9dc; --muted: var(--quiet);
  --critical: var(--over); --critical-ink: var(--over-ink);
  --pin-span: rgba(227, 154, 0, 0.16); --playhead: var(--ink);
  --border: rgba(18, 20, 43, 0.1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --paper: #0a0c16; --card: #121528; --sunk: #1a1e36; --ink: #f1f2fa; --ink-2: #bcc1d8; --quiet: #8c93b2;
    --line: #232744; --line-2: #343a5e; --caller: #8a8cff; --agent: #2bd9be;
    --caller-block: rgba(138, 140, 255, 0.14); --agent-block: rgba(43, 217, 190, 0.14);
    --over: #f5b342; --over-ink: #f5b342; --over-soft: rgba(245, 179, 66, 0.16);
    --error: #ff6b6b; --error-ink: #ff9d9d; --error-soft: rgba(255, 107, 107, 0.14);
    --warn: #8c93b2; --warn-ink: #bcc1d8; --chaos: #ff7ac6; --pass: #34d27b; --pass-ink: #34d27b;
    --focus: #8a8cff; --axis: #3a4066; --pin-span: rgba(245, 179, 66, 0.2); --border: rgba(255, 255, 255, 0.1);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0a0c16; --card: #121528; --sunk: #1a1e36; --ink: #f1f2fa; --ink-2: #bcc1d8; --quiet: #8c93b2;
  --line: #232744; --line-2: #343a5e; --caller: #8a8cff; --agent: #2bd9be;
  --caller-block: rgba(138, 140, 255, 0.14); --agent-block: rgba(43, 217, 190, 0.14);
  --over: #f5b342; --over-ink: #f5b342; --over-soft: rgba(245, 179, 66, 0.16);
  --error: #ff6b6b; --error-ink: #ff9d9d; --error-soft: rgba(255, 107, 107, 0.14);
  --warn: #8c93b2; --warn-ink: #bcc1d8; --chaos: #ff7ac6; --pass: #34d27b; --pass-ink: #34d27b;
  --focus: #8a8cff; --axis: #3a4066; --pin-span: rgba(245, 179, 66, 0.2); --border: rgba(255, 255, 255, 0.1);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.quiet { color: var(--quiet); }
.display { font-family: var(--display); font-weight: 650; letter-spacing: -0.02em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* masthead */
.masthead { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mark { display: inline-flex; align-items: center; gap: 10px; font: 650 19px/1 var(--display); letter-spacing: -0.02em; }
.mark svg { display: block; }
.runmeta { color: var(--quiet); font-size: 13px; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.tool { background: transparent; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 12px; color: var(--ink-2); cursor: pointer; font-size: 13px; }
.tool:hover { background: var(--sunk); color: var(--ink); }

/* verdict */
.verdict { padding: 44px 0 4px; }
.stamp { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; padding: 5px 12px 5px 8px; border-radius: 999px; margin: 0; }
.stamp.fail { background: var(--over-soft); color: var(--over-ink); }
.stamp.error { background: var(--error-soft); color: var(--error-ink); }
.stamp.pass { background: rgba(18, 161, 80, 0.12); color: var(--pass-ink); }
.pip { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; }
.pip.pass { background: var(--pass); }
.pip.fail { background: var(--over); }
.pip.error { background: var(--error); }
.stamp .pip { width: 9px; height: 9px; }

/* check by check */
.checks { border-top: 1px solid var(--line-2); }
.check { display: grid; grid-template-columns: minmax(200px, 330px) minmax(120px, 1fr) minmax(190px, 240px); gap: 8px 28px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.cname { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cname b { font-weight: 600; }
.cname span { color: var(--quiet); font-size: 13px; }
.cbar { display: flex; gap: 3px; height: 12px; }
.cbar span { display: block; min-width: 0; border-radius: 3px; }
.cbar .in { background: var(--pass); }
.cbar .out { background: var(--over); }
.ccount { color: var(--quiet); font-size: 14px; }
.ccount b { color: var(--ink); font: 650 17px var(--display); letter-spacing: -0.01em; }
.ccount.held b { color: var(--pass-ink); }
h1 { font: 650 clamp(34px, 5.2vw, 60px)/1.02 var(--display); letter-spacing: -0.035em; margin: 18px 0 0; max-width: 20ch; text-wrap: balance; }
.lede { font-size: clamp(17px, 2vw, 21px); line-height: 1.45; color: var(--ink-2); max-width: 56ch; margin: 16px 0 0; }
.facts { color: var(--quiet); font-size: 14px; margin: 14px 0 0; }
.banner { margin: 18px 0 0; padding: 10px 14px; border-radius: 8px; max-width: 78ch; border: 1px solid var(--warn); background: rgba(226, 154, 0, 0.09); font-size: 14px; }

/* section heads */
.section { padding-top: 64px; }
.sechead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
h2 { font: 650 clamp(24px, 3vw, 32px)/1.1 var(--display); letter-spacing: -0.03em; margin: 0; }
.sub { color: var(--quiet); max-width: 64ch; margin: 0; }

/* what went wrong: a ledger, each problem next to the moment it happened */
.ledger { border-top: 1px solid var(--line-2); }
.finding { display: grid; grid-template-columns: 176px minmax(0, 1fr) minmax(300px, 400px); gap: 8px 32px; padding: 26px 0; border-bottom: 1px solid var(--line); align-items: center; }
.fvalue { font: 650 clamp(40px, 4.6vw, 58px)/0.95 var(--display); letter-spacing: -0.04em; color: var(--ink); }
.fvalue small { font-size: 0.42em; font-weight: 600; letter-spacing: -0.01em; margin-left: 3px; }
.flimit { display: block; margin-top: 8px; font: 500 13px/1.3 var(--sans); letter-spacing: 0; color: var(--quiet); }
.fbody h3 { font: 650 22px/1.2 var(--display); letter-spacing: -0.02em; margin: 0 0 6px; }
.fbody p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.fscope { color: var(--quiet); font-size: 13.5px; margin-top: 6px !important; }
.hear { margin-top: 16px; display: inline-flex; align-items: center; gap: 9px; border: 0; border-radius: 999px; padding: 8px 16px 8px 10px; background: var(--ink); color: var(--paper); cursor: pointer; font-weight: 600; font-size: 14px; }
.hear:hover { opacity: 0.88; }
.hear svg { display: block; }
.moment { display: block; width: 100%; border-radius: 6px; background: var(--card); border: 1px solid var(--line); }
.none { padding: 28px 0; border-top: 1px solid var(--line-2); color: var(--ink-2); font-size: 18px; }

/* every call: aligned tapes grouped by scenario */
.wall { border-top: 1px solid var(--line-2); }
.scn { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 4px 28px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.scn-name { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.scn-name b { font: 650 17px/1.2 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.scn-name span { color: var(--quiet); font-size: 13px; line-height: 1.4; }
.tapes { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tape { cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; }
.tape:hover { background: var(--sunk); }
.tape[aria-current="true"] { background: var(--card); border-color: var(--ink); box-shadow: var(--shadow); }
.tape .n { color: var(--quiet); font-size: 13px; display: flex; align-items: center; gap: 4px; }
.tape .t { color: var(--quiet); font-size: 12.5px; display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
.tape:hover .t { color: var(--ink); }
.tape .strip { min-width: 0; }
.tape canvas { display: block; height: 34px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 14px 0 0; color: var(--quiet); font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }

/* status marks */
.ic { display: inline-flex; flex: none; }
.ic svg { display: block; }
.ic.pass { color: var(--pass); }
.ic.fail { color: var(--over); }
.ic.warn { color: var(--warn); }

/* the call */
.player { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 28px 30px 26px; }
.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.picker select { font: inherit; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; max-width: 100%; cursor: pointer; }
.callhead { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
.callhead h3 { font: 650 26px/1.1 var(--display); letter-spacing: -0.025em; margin: 0; }
.callfacts { color: var(--quiet); font-size: 13.5px; display: flex; gap: 4px 14px; flex-wrap: wrap; margin-top: 6px; }
.transport { display: flex; align-items: center; gap: 14px; margin: 22px 0 14px; flex-wrap: wrap; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.play:hover { opacity: 0.88; }
.clock { font: 600 15px var(--sans); min-width: 108px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.hint { margin-left: auto; color: var(--quiet); font-size: 13px; }
.timeline { display: grid; grid-template-columns: 150px 1fr; }
.labels { display: flex; flex-direction: column; }
.label { display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
.label b { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.label .lsub { color: var(--quiet); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
canvas { display: block; width: 100%; }
#timeline-canvas { cursor: pointer; }
#overview { cursor: grab; border-radius: 6px; background: var(--sunk); }
.tip { position: absolute; pointer-events: none; z-index: 5; max-width: 340px; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); display: none; }
.problems { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--line); }
.problems > li { border-bottom: 1px solid var(--line); }
.prob { display: flex; gap: 12px; width: 100%; text-align: left; align-items: baseline; border: 0; background: transparent; padding: 11px 8px; cursor: pointer; border-radius: 8px; }
.prob:hover, .prob[aria-current="true"] { background: var(--sunk); }
.prob .when { color: var(--quiet); min-width: 62px; font-variant-numeric: tabular-nums; }
.prob .kind { font-weight: 600; white-space: nowrap; }
.prob .count { color: var(--quiet); font-weight: 500; }
.times { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 8px 12px 82px; }
.chip { border: 1px solid var(--line-2); border-radius: 6px; background: transparent; padding: 1px 8px; cursor: pointer; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.chip[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.sev { display: inline-flex; align-self: center; }
.note { font-size: 13px; color: var(--quiet); margin-top: 10px; }
.error-box { border: 1px solid var(--error); color: var(--error-ink); border-radius: 8px; padding: 10px 12px; margin-top: 14px; white-space: pre-wrap; }
.okline { margin-top: 18px; color: var(--quiet); }
.failline { margin-top: 18px; color: var(--over-ink); font-weight: 600; }

/* the numbers */
.nscn { border-top: 1px solid var(--line); }
.nscn:last-of-type { border-bottom: 1px solid var(--line); }
.nscn > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 24px 230px minmax(0, 1fr) 24px; gap: 14px; align-items: center; padding: 16px 0; }
.nscn > summary::-webkit-details-marker { display: none; }
.nscn > summary b { font: 650 17px/1.2 var(--display); letter-spacing: -0.02em; }
.nscn > summary span.s { color: var(--quiet); font-size: 14px; }
.nscn > summary .chev { width: 8px; height: 8px; border-right: 2px solid var(--quiet); border-bottom: 2px solid var(--quiet); transform: rotate(45deg); transition: transform 0.15s; justify-self: center; }
.nscn[open] > summary .chev { transform: rotate(225deg); }
.metrics { padding: 0 0 22px 38px; display: grid; grid-template-columns: minmax(150px, 230px) minmax(160px, 1fr) minmax(120px, 190px) 28px minmax(0, 90px); gap: 12px 20px; align-items: center; }
.metrics .mh { color: var(--quiet); font-size: 12.5px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.mname { display: flex; align-items: center; gap: 6px; font-size: 14.5px; }
.gauge { position: relative; height: 22px; }
.gauge .track { position: absolute; left: 0; right: 0; top: 10px; height: 3px; border-radius: 2px; background: var(--line); }
.gauge .whisker { position: absolute; top: 5px; height: 13px; border-left: 2px solid var(--quiet); border-right: 2px solid var(--quiet); }
.gauge .whisker::after { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 2px solid var(--quiet); }
.gauge .limit { position: absolute; top: 1px; bottom: 1px; width: 0; border-left: 2px dashed var(--over); }
.gauge .val { position: absolute; top: 4px; width: 15px; height: 15px; margin-left: -7px; border-radius: 50%; background: var(--ink); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--ink); }
.gauge .val.bad { background: var(--over); box-shadow: 0 0 0 1px var(--over); }
.gauge .val.good { background: var(--pass); box-shadow: 0 0 0 1px var(--pass); }
.mval b { font: 650 17px var(--display); letter-spacing: -0.01em; }
.mval small { display: block; color: var(--quiet); font-size: 12.5px; line-height: 1.3; }
.diff.bad { color: var(--over-ink); font-weight: 600; }
.diff.good { color: var(--pass-ink); font-weight: 600; }

.howto { margin-top: 40px; }
.howto > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 6px 0; }
dl.glossary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 14px 0 0; max-width: 78ch; }
dl.glossary dt { font-weight: 600; }
dl.glossary dd { margin: 0; color: var(--ink-2); }
.foot { margin: 72px 0 60px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--quiet); font-size: 13px; }

/* ⓘ explanations */
.info { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; color: var(--quiet); font: italic 700 10.5px/1 Georgia, serif; cursor: help; padding: 0; }
.info:hover::after, .info:focus::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); width: max-content; max-width: 280px; background: var(--ink); color: var(--paper); padding: 8px 11px; border-radius: 8px; font: 400 13px/1.4 var(--sans); text-align: left; z-index: 20; box-shadow: var(--shadow); white-space: normal; }

dialog { border: 1px solid var(--line-2); border-radius: 14px; background: var(--card); color: var(--ink); padding: 20px 24px; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 12, 22, 0.45); }
dialog table { border-collapse: collapse; }
dialog td { padding: 5px 16px 5px 0; vertical-align: baseline; }
kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--sunk); }

@media (max-width: 980px) {
  .check { grid-template-columns: 1fr; gap: 6px; }
  .finding { grid-template-columns: 1fr; gap: 14px; }
  .scn { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: minmax(0, 1fr) 28px; }
  .metrics .mh { display: none; }
  .metrics .gauge, .metrics .mlim { grid-column: 1 / -1; }
  .nscn > summary { grid-template-columns: 24px minmax(0, 1fr) 24px; }
  .nscn > summary span.s { display: none; }
}
@media (max-width: 700px) {
  .wrap { padding: 0 16px; }
  .verdict { padding-top: 36px; }
  .section { padding-top: 56px; }
  .player { padding: 20px 16px; border-radius: 10px; }
  .timeline { grid-template-columns: 78px 1fr; }
  .label .lsub, .hint { display: none; }
  .times { padding-left: 8px; }
  .callhead h3 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<audio id="audio" preload="auto"></audio>
<dialog id="help">
  <h3 class="display" style="margin:0 0 12px">Keyboard shortcuts</h3>
  <table>
    <tr><td><kbd>Space</kbd></td><td>Play or pause</td></tr>
    <tr><td><kbd>N</kbd> <kbd>P</kbd></td><td>Next or previous problem (plays from just before it)</td></tr>
    <tr><td><kbd>J</kbd> <kbd>K</kbd></td><td>Next or previous call</td></tr>
    <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Back or forward 1 s (<kbd>Shift</kbd>: 5 s)</td></tr>
    <tr><td><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></td><td>Zoom in, zoom out, whole call</td></tr>
    <tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Hear both sides, only the caller, only the agent</td></tr>
    <tr><td><kbd>T</kbd></td><td>Light or dark</td></tr>
    <tr><td><kbd>?</kbd></td><td>This help</td></tr>
  </table>
  <form method="dialog" style="margin-top:14px;text-align:right"><button class="tool">Close</button></form>
</dialog>
<script id="report-data" type="application/json">/*__CALLBACK_REPORT_DATA__*/null</script>
<script>
// @ts-check
"use strict";

/**
 * @typedef {{metric: string, t_s: number, end_s: number|null, message: string, severity: "fail"|"warn", chaos_id: string|null}} Finding
 * @typedef {{who: "caller"|"agent", start: number, end: number, text: string}} SpeechTurn
 * @typedef {{t: number, end: number|null, type: string, id: string|null, text: string|null, phase: string|null, data: Object<string, unknown>}} ChaosMark
 * @typedef {{t: number, v: number}} LatencyPoint
 * @typedef {{call_id: string, scenario_id: string, trial: number, seed: string, passed: boolean, error: string|null,
 *   failure_reasons: string[], findings: Finding[], review: {check: string, heard: string|null, reason: string, t_s: number|null}[],
 *   metrics?: {name: string, value: number|null, unit: string, threshold: number|null, passed: boolean|null}[],
 *   duration_s?: number, end_reason?: string, chaos?: ChaosMark[], speech?: SpeechTurn[],
 *   latency?: LatencyPoint[], latency_limit?: number|null, remeasured?: boolean,
 *   peaks?: {caller: number[], agent: number[]}, audio_s?: number, audio?: string}} Call
 * @typedef {{name: string, value: number|null, ci_low: number|null, ci_high: number|null, n: number, unit: string,
 *   threshold: number|null, comparator: string, passed: boolean|null}} Aggregate
 * @typedef {{metric: string, baseline: number|null, current: number|null, delta: number|null, direction: string, regressed: boolean}} Diff
 * @typedef {{scenario_id: string, agent: string, passed: boolean, sentence: string, failure_reasons: string[],
 *   aggregates: Aggregate[], baseline: Diff[], calls: Call[]}} Scenario
 * @typedef {{title: string, value: string|null, limit: string|null, detail: string, scenario_id: string, scenarios?: number,
 *   finding: string, call_id: string|null, t_s: number|null, trial: number|null}} Tile
 * @typedef {{run: {run_id: string, created_at: string, callback_version: string, git_sha: string|null, mode: string,
 *   duration_s: number, exit_code: number, passed: boolean, baseline_name: string|null,
 *   limit_overrides?: {scenario_id: string, metric: string, target: number, applied: number, source: string}[]},
 *   summary: {sentence: string, tiles: Tile[]}, scenarios: Scenario[]}} RunReport
 * @typedef {{key: string, label: string, severity: "fail"|"warn", items: number[]}} Group
 */

/** @type {RunReport} */
const DATA = JSON.parse(/** @type {HTMLElement} */ (document.getElementById("report-data")).textContent || "null");
const app = /** @type {HTMLElement} */ (document.getElementById("app"));
const audio = /** @type {HTMLAudioElement} */ (document.getElementById("audio"));
const help = /** @type {HTMLDialogElement} */ (document.getElementById("help"));
/** @type {Call[]} */
const CALLS = DATA.scenarios.flatMap((s) => s.calls);
const PRE_ROLL_S = 0.75;
const FOCUS_SPAN_S = 14;

const state = {
  /** @type {Call|null} */ call: null,
  /** index into the call's findings; -1 for none */ finding: -1,
  view: { t0: 0, t1: 1 },
  /** @type {number|null} */ raf: null,
};

// ---------- words ----------

/** Short explanations for every term the page uses: [term, explanation]. */
const GLOSSARY = /** @type {Object<string, [string, string]>} */ ({
  p95: ["Slowest typical (p95)", "95 out of every 100 replies were faster than this. It shows the slow cases without letting one outlier decide."],
  p50: ["Typical (median)", "Half the replies were faster than this, half slower."],
  range: ["95% range", "Where the true value probably lies, judging from only these calls. More calls make it narrower."],
  limit: ["Limit", "The pass or fail line set in the scenario. Only these hard checks can fail a run."],
  wait: ["Wait before reply", "From the moment the caller stops talking to the agent's first sound, measured on the recording. Each bar is one reply."],
  yield: ["Time to stop", "When the caller cuts in, how long the agent keeps talking before it goes quiet."],
  talkover: ["Talk-over", "The share of the caller's speech that the agent talked over."],
  falseyield: ["False stop", "The agent stopped talking for a “mm-hmm” or “okay” it should have ignored."],
  silence: ["Check-in on silence", "When the caller goes quiet, how long before the agent checks in."],
  passed: ["Calls on target", "Calls in which every hard check stayed within its limit."],
  unanswered: ["Unanswered turns", "The caller finished, waited at least the reply limit, and the agent said nothing. A caller who goes straight on to the next sentence doesn't count: the agent had no opening."],
  events: ["Events", "Amber ◆ marks a disturbance Callback caused on purpose (an interruption, noise, silence). Red ▼ marks a problem; hover it for one sentence."],
  caller: ["Caller", "The simulated caller, recorded on the left channel. Shaded blocks are where it was speaking."],
  agent: ["Agent", "Your agent, recorded on the right channel. Shaded blocks are where it was speaking."],
});

/** @type {Object<string, string>} */
const METRIC_LABELS = {
  task_success_rate: "Task success", call_pass_rate: "Calls on target",
  response_latency_p95_s: "Reply delay, slowest typical", response_latency_p50_s: "Reply delay, typical",
  time_to_yield_p95_s: "Time to stop when interrupted", talk_over_ratio: "Talk-over", false_yields: "False stops",
  silence_reprompt_s: "Check-in on silence", entity_fidelity: "Facts correct", policy_violations: "Policy violations",
  unanswered_turns: "Unanswered turns", rules_not_checked: "Rules not checked",
};
/** @type {Object<string, string>} */
const METRIC_TERMS = {
  response_latency_p95_s: "p95", response_latency_p50_s: "p50", time_to_yield_p95_s: "yield",
  talk_over_ratio: "talkover", false_yields: "falseyield", silence_reprompt_s: "silence", call_pass_rate: "passed",
  unanswered_turns: "unanswered",
};
/** @type {Object<string, string>} */
const FINDING_LABELS = {
  response_latency: "Slow reply", time_to_yield: "Slow to stop", talk_over: "Talk-over",
  false_yield: "False stop", silence_reprompt: "No check-in", task_success: "Task not done",
  entity_fidelity: "Wrong fact", policy_violations: "Policy broken", unanswered_turns: "Never answered",
  folded_turns: "Answered late",
};
/** @type {Object<string, number>} */
const FINDING_WEIGHT = {
  task_success: 0, entity_fidelity: 1, policy_violations: 2, unanswered_turns: 2.7, time_to_yield: 3, false_yield: 4,
  silence_reprompt: 5, talk_over: 6, response_latency: 7,
};

// ---------- small helpers ----------

/**
 * @param {string} tag
 * @param {Object<string, any>} [attrs]
 * @param {(Node|string|null|undefined|false)[]} [children]
 * @returns {HTMLElement}
 */
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children) if (c !== null && c !== undefined && c !== false) el.append(c);
  return el;
}

const ICONS = {
  pass: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M4.6 8.3l2.3 2.3 4.6-4.9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  fail: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l7 12.4H1z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.6M8 11.4v.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
  play: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="11" fill="currentColor" opacity=".16"/><path d="M8.6 6.6l7 4.4-7 4.4z" fill="currentColor"/></svg>',
  bigplay: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.8l10 6.2-10 6.2z" fill="currentColor"/></svg>',
  pause: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2h3.2v12H3.5zM9.3 2h3.2v12H9.3z" fill="currentColor"/></svg>',
};
/** @param {"pass"|"fail"|"warn"} kind @param {string} label */
function icon(kind, label) {
  const s = h("span", { class: `ic ${kind}`, role: "img", "aria-label": label });
  s.innerHTML = ICONS[kind];
  return s;
}
/** @param {keyof typeof ICONS} name */
function glyph(name) {
  const s = h("span", { class: "glyph", "aria-hidden": "true", style: "display:inline-flex" });
  s.innerHTML = ICONS[name];
  return s;
}

/** An ⓘ that explains a term on hover or keyboard focus. @param {string} key */
function info(key) {
  const [term, text] = GLOSSARY[key] || [key, ""];
  return h("button", { class: "info", type: "button", "data-tip": text, "aria-label": `${term}: ${text}` }, ["i"]);
}

/** @param {number|null|undefined} v @param {string} unit */
function fmt(v, unit) {
  if (v === null || v === undefined) return "–";
  if (unit === "s") return `${v.toFixed(2)} s`;
  if (unit === "ratio") {
    const pct = v * 100;
    return `${pct > 0 && pct < 10 && !Number.isInteger(pct) ? pct.toFixed(1) : Math.round(pct)}%`;
  }
  return String(Math.round(v * 1000) / 1000);
}

/** @param {number} t */
function clock(t) {
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, "0")}`;
}

/** @param {string} name */
function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/** A quiet status dot for lists. @param {boolean} ok @param {string} label */
function pip(ok, label) {
  return h("span", { class: `pip ${ok ? "pass" : "fail"}`, role: "img", "aria-label": label });
}
/** @param {Call} c */
function callMark(c) {
  if (c.error) return h("span", { class: "pip error", role: "img", "aria-label": "could not run" });
  return pip(c.passed, c.passed ? "on target" : "above target");
}

/** @param {Finding} f */
function findingLabel(f) {
  // older runs recorded an unanswered turn as a response-latency warning
  if (f.metric === "response_latency" && /never answered/i.test(f.message)) return "Never answered";
  return FINDING_LABELS[f.metric] || f.metric;
}

/** Which problem a call opens on: one a chaos event caused, else the most serious. @param {Call} c */
function primaryFinding(c) {
  let best = -1, bestScore = Infinity;
  c.findings.forEach((f, i) => {
    if (f.severity !== "fail") return;
    const score = (f.chaos_id ? 0 : 100) + (FINDING_WEIGHT[f.metric] ?? 50) + f.t_s / 1e4;
    if (score < bestScore) { best = i; bestScore = score; }
  });
  return best;
}

/**
 * Repeated problems of one kind become one group, so the unique ones stand out.
 * The primary problem's group comes first, then failures before warnings, by seriousness.
 * @param {Call} c @returns {Group[]}
 */
function groupFindings(c) {
  /** @type {Map<string, Group>} */
  const groups = new Map();
  c.findings.forEach((f, i) => {
    const label = findingLabel(f);
    const key = `${label}:${f.severity}`;
    const g = groups.get(key) || { key, label, severity: f.severity, items: [] };
    g.items.push(i);
    groups.set(key, g);
  });
  const primary = primaryFinding(c);
  return [...groups.values()].sort((a, b) => {
    if (a.items.includes(primary)) return -1;
    if (b.items.includes(primary)) return 1;
    if (a.severity !== b.severity) return a.severity === "fail" ? -1 : 1;
    return (FINDING_WEIGHT[c.findings[a.items[0]].metric] ?? 50) - (FINDING_WEIGHT[c.findings[b.items[0]].metric] ?? 50);
  });
}

/** "2.15–2.22 s (limit 1.5 s)" from messages like "took 2.15 s … (limit 1.50 s)". @param {Call} c @param {Group} g */
function groupRange(c, g) {
  const nums = g.items.map((i) => Number((c.findings[i].message.match(/(\d+\.\d+) s/) || [])[1])).filter((n) => !Number.isNaN(n));
  if (nums.length < 2) return "";
  const lo = Math.min(...nums), hi = Math.max(...nums);
  const limit = (c.findings[g.items[0]].message.match(/limit (\d+\.\d+) s/) || [])[1];
  return `${lo.toFixed(2)}–${hi.toFixed(2)} s${limit ? ` (limit ${Number(limit)} s)` : ""}`;
}

// ---------- the page, top to bottom ----------

function totals() {
  const calls = CALLS.length;
  const failed = CALLS.filter((c) => c.error || !c.passed).length;
  const errored = CALLS.filter((c) => c.error).length;
  return { calls, failed, errored };
}

function renderMasthead() {
  const run = DATA.run;
  const when = new Date(run.created_at);
  return h("header", { class: "masthead" }, [
    h("span", { class: "mark" }, [
      (() => {
        const s = h("span", { "aria-hidden": "true", style: "display:inline-flex" });
        s.innerHTML = '<svg width="26" height="22" viewBox="0 0 26 22"><g fill="none" stroke-linecap="round" stroke-width="3"><path d="M3 9v4M8.5 5v12" stroke="var(--caller)"/><path d="M14 3v16M19.5 7v8M24 10v2" stroke="var(--agent)"/></g></svg>';
        return s;
      })(),
      "callback",
    ]),
    h("span", { class: "runmeta num" }, [`Run ${run.run_id}, ${when.toLocaleString()}, Callback ${run.callback_version}${run.git_sha ? `, commit ${run.git_sha.slice(0, 7)}` : ""}`]),
    h("div", { class: "tools" }, [
      h("button", { class: "tool", onclick: toggleTheme, title: "Light or dark (T)" }, ["Theme"]),
      h("button", { class: "tool", onclick: () => help.showModal(), title: "Keyboard shortcuts (?)" }, ["Shortcuts"]),
    ]),
  ]);
}

function renderVerdict() {
  const run = DATA.run;
  const { calls, failed, errored } = totals();
  const cls = run.exit_code === 0 ? "pass" : run.exit_code === 1 ? "fail" : "error";
  const word = cls === "pass" ? "On target" : cls === "fail" ? "Above target" : "Could not run";
  const calls_ = `${calls} call${calls === 1 ? "" : "s"}`;
  const rows = checkRows();
  const over = rows.filter((r) => r.over > 0).length;
  const headline = errored
    ? `${errored} of ${calls_} could not run.`
    : failed === 0 || !rows.length ? `${calls_} ran. Every check was on target.`
    : `${calls_} ran. ${over} of ${rows.length} check${rows.length === 1 ? "" : "s"} went above target at least once.`;
  const scen = DATA.scenarios;
  const mins = run.duration_s >= 90 ? `${Math.round(run.duration_s / 60)} minutes` : `${Math.round(run.duration_s)} seconds`;
  return h("section", { class: "verdict" }, [
    h("p", { class: `stamp ${cls}`, role: "status" }, [h("span", { class: `pip ${cls}`, "aria-hidden": "true" }), word]),
    h("h1", {}, [headline]),
    h("p", { class: "lede" }, [ledeText(errored, failed)]),
    h("p", { class: "facts num" }, [
      `${calls_} across ${scen.length} scenario${scen.length === 1 ? "" : "s"}, ${mins}. The limits are the ones set in each scenario: Callback's defaults unless a scenario changes them. They are starting points, not an industry standard. Exit code ${run.exit_code}.`,
      run.baseline_name ? ` Compared with baseline ${run.baseline_name}.` : "",
    ]),
    ciLimitBanner(),
    uncheckedRulesBanner(),
  ]);
}

/** @param {number} errored @param {number} failed */
function ledeText(errored, failed) {
  if (errored) return DATA.summary.sentence;
  if (failed > 0 && DATA.summary.tiles.length) return shortLede(DATA.summary.tiles);
  return DATA.run.baseline_name ? DATA.summary.sentence : "Open any call below to listen to it.";
}

/** The worst problem in a few words; the rest are listed below it. @param {Tile[]} tiles */
function shortLede(tiles) {
  const t = tiles[0];
  const worst = t.value ? `${t.title.toLowerCase()}: ${t.value}${t.limit ? `, ${limitText(t.limit)}` : ""}` : t.title.toLowerCase();
  const none = CALLS.some((c) => c.error) ? "" : "No call errored out. ";
  return `${none}The one that stood out most: ${worst}.`;
}

/** Rules nobody checked must never look like rules that passed: say so up top. */
function uncheckedRulesBanner() {
  const skipped = (DATA.scenarios || []).filter((s) =>
    (s.aggregates || []).some((a) => a.name === "rules_not_checked" && (a.value || 0) > 0));
  if (!skipped.length) return null;
  return h("p", { class: "banner", role: "note" }, [
    h("b", {}, ["Some rules were not checked. "]),
    `Plain-English must_not rules in ${skipped.map((s) => s.scenario_id).join(", ")} need the LLM judge, `
      + "which is not configured (providers.judge in callback.yaml). Pattern rules were checked.",
  ]);
}

/** A loosened CI limit must never be mistaken for the real target: say so up top. */
function ciLimitBanner() {
  const overrides = DATA.run.limit_overrides || [];
  if (!overrides.length) return null;
  const what = /** @type {Object<string, string>} */ ({ response_latency_p95_s: "Reply delay p95", time_to_yield_p95_s: "Time to stop when interrupted (p95)", chaos_drift_max_s: "Chaos timing drift" });
  const lines = [...new Set(overrides.map((o) => o.metric))].map((metric) => {
    const these = overrides.filter((o) => o.metric === metric);
    const applied = [...new Set(these.map((o) => o.applied))].join(", ");
    const target = [...new Set(these.map((o) => o.target))].join(", ");
    return `${what[metric] || metric} allowed up to ${applied} s on this machine (${these[0].source}); the real target is ${target} s.`;
  });
  return h("p", { class: "banner", role: "note" }, [
    h("b", {}, ["CI limit in use. "]),
    lines.join(" "),
    " Numbers between the two pass here but would fail the real target.",
  ]);
}

/** @param {string} id @param {string} title @param {string} sub @param {(Node|null)[]} body */
function section(id, title, sub, body) {
  return h("section", { class: "section", id }, [
    h("div", { class: "sechead" }, [h("h2", {}, [title]), sub ? h("p", { class: "sub" }, [sub]) : null]),
    ...body,
  ]);
}

// ---------- check by check: how each limit fared ----------

/** @type {{name: string, label: string, limit: (m: {threshold: number|null, unit: string}) => string}[]} */
const CHECKS = [
  { name: "response_latency_p95_s", label: "Replies within the limit", limit: (m) => `slowest typical reply ≤ ${fmt(m.threshold, m.unit)}` },
  { name: "time_to_yield_p95_s", label: "Stops promptly when interrupted", limit: (m) => `≤ ${fmt(m.threshold, m.unit)}` },
  { name: "talk_over_ratio", label: "Lets the caller finish", limit: (m) => `talk-over ≤ ${fmt(m.threshold, m.unit)} of their speech` },
  { name: "false_yields", label: "Keeps going through “mm-hmm”", limit: () => "no stops" },
  { name: "silence_reprompt_s", label: "Checks in when the caller goes quiet", limit: (m) => `within ${fmt(m.threshold, m.unit)}` },
  { name: "unanswered_turns", label: "Answers every turn", limit: () => "no unanswered turns" },
  { name: "task_success_rate", label: "Finishes the task", limit: () => "end state matches" },
  { name: "entity_fidelity", label: "Reads facts back correctly", limit: () => "every fact right" },
  { name: "policy_violations", label: "Stays within its rules", limit: () => "no breaches" },
];

/** For each check: in how many of the calls it applied to did it stay within its limit. */
function checkRows() {
  /** @type {{label: string, within: number, over: number, limit: string, measured: string}[]} */
  const rows = [];
  for (const spec of CHECKS) {
    let within = 0, over = 0, sample = null;
    /** @type {number[]} */
    const values = [];
    for (const c of CALLS) {
      const m = (c.metrics || []).find((x) => x.name === spec.name);
      if (!m || m.passed === null || m.passed === undefined) continue;
      if (m.passed) within += 1; else over += 1;
      if (m.value !== null && m.value !== undefined) values.push(m.value);
      sample = sample || m;
    }
    if (!sample || within + over === 0) continue;
    const lo = Math.min(...values), hi = Math.max(...values);
    const unit = sample.unit === "count" ? " per call" : "";
    const measured = !values.length ? "" : lo === hi ? `${fmt(lo, sample.unit)}${unit}` : `${fmt(lo, sample.unit)} to ${fmt(hi, sample.unit)}${unit}`;
    rows.push({ label: spec.label, within, over, limit: spec.limit(sample), measured });
  }
  return rows;
}

function renderChecks() {
  const rows = checkRows();
  if (!rows.length) return null;
  return section("checks", "Check by check", "How many calls stayed within each limit, and what was measured. A check only counts in the calls where it applies. The limits are set in the scenario files, so a different limit would give a different count.", [
    h("div", { class: "checks" }, rows.map((r) => {
      const n = r.within + r.over;
      return h("div", { class: "check" }, [
        h("div", { class: "cname" }, [h("b", {}, [r.label]), h("span", {}, [`Limit: ${r.limit}.${r.measured ? ` Measured: ${r.measured}.` : ""}`])]),
        h("div", { class: "cbar", role: "img", "aria-label": `${r.within} of ${n} calls within the limit` }, [
          h("span", { class: "in", style: `flex:${r.within}` }), h("span", { class: "out", style: `flex:${r.over}` }),
        ]),
        h("div", { class: `ccount num${r.over === 0 ? " held" : ""}` }, [h("b", {}, [`${r.within} of ${n}`]), " calls within the limit"]),
      ]);
    })),
  ]);
}

// ---------- what stood out: each problem beside the moment it happened ----------

/** @param {Tile} t */
function findingFor(t) {
  const c = CALLS.find((x) => x.call_id === t.call_id);
  if (!c || t.t_s === null) return null;
  const f = c.findings.find((x) => Math.abs(x.t_s - /** @type {number} */ (t.t_s)) < 0.01);
  return c.peaks && f ? { c, f } : null;
}

function renderFindings() {
  const tiles = DATA.summary.tiles;
  if (!tiles.length) {
    if (!CALLS.some((c) => c.error)) return null;
    return section("problems", "What stood out", "", [h("p", { class: "none" }, ["Some calls could not run. Their errors are in the calls below."])]);
  }
  const rows = tiles.map((t) => {
    const moment = findingFor(t);
    const where = (t.scenarios || 1) > 1 ? `In ${t.scenarios} of ${DATA.scenarios.length} scenarios. Worst in ${t.scenario_id}.` : (DATA.scenarios.length > 1 ? `In ${t.scenario_id}.` : "");
    const parsed = t.value ? null : String(t.detail).match(/(\d+(?:\.\d+)?) s/);
    const [num, unit0] = t.value ? splitValue(t.value) : parsed ? [parsed[1], "s"] : [null, ""];
    const unit = unit0 || (num && COUNTS.includes(t.finding) ? "per call" : "");
    const cv = moment ? /** @type {HTMLCanvasElement} */ (h("canvas", { class: "moment", role: "img", "aria-label": `${t.title}: the moment it happened, caller above, agent below` })) : null;
    if (cv && moment) momentCanvases.push({ cv, c: moment.c, f: moment.f });
    return h("article", { class: "finding" }, [
      h("div", { class: "fvalue num" }, num ? [num, unit ? h("small", {}, [unit]) : null, t.limit ? h("span", { class: "flimit" }, [limitText(t.limit)]) : parsed ? h("span", { class: "flimit" }, ["of silence, no check-in"]) : null] : [icon("fail", "problem")]),
      h("div", { class: "fbody" }, [
        h("h3", {}, [t.title]),
        h("p", {}, [t.detail]),
        where ? h("p", { class: "fscope" }, [where]) : null,
        t.call_id !== null && t.t_s !== null ? h("button", {
          class: "hear", onclick: () => hearAt(/** @type {string} */ (t.call_id), /** @type {number} */ (t.t_s)),
        }, [glyph("bigplay"), `Hear it, trial ${t.trial} at ${clock(t.t_s)}`]) : null,
      ]),
      cv,
    ]);
  });
  return section("problems", "What stood out", "The behaviours that went above target, most serious first. Each shows the moment it happened: the caller above, the agent below.", [
    h("div", { class: "ledger" }, rows),
  ]);
}

/** "1.05 s" -> ["1.05", "s"]; "6.6%" -> ["6.6", "%"]; "1" -> ["1", ""]. @param {string|null} v */
function splitValue(v) {
  if (v === null || v === undefined) return [null, ""];
  const m = String(v).match(/^([\d.]+)\s*(.*)$/);
  return m ? [m[1], m[2]] : [String(v), ""];
}
/** @param {string} limit */
function limitText(limit) {
  return limit.startsWith("was") ? limit : `limit ${limit.replace(/^[≤≥] /, "")}`;
}

/** Problems counted per call, not measured in seconds. */
const COUNTS = ["false_yield", "unanswered_turns"];

/** @type {{cv: HTMLCanvasElement, c: Call, f: Finding}[]} */
const momentCanvases = [];

const MOMENT_WORDS = /** @type {Object<string, (d: number) => string>} */ ({
  response_latency: (d) => `${d.toFixed(2)} s of silence`,
  time_to_yield: (d) => `${d.toFixed(2)} s to stop`,
  talk_over: (d) => `${d.toFixed(2)} s talking over`,
  unanswered_turns: (d) => `no answer for ${d.toFixed(1)} s`,
  silence_reprompt: (d) => `${d.toFixed(1)} s of quiet`,
  false_yield: () => "stopped for an “mm-hmm”",
});

/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} w @param {number} hgt @param {string} color */
function hatch(g, x, y, w, hgt, color) {
  g.save();
  g.beginPath(); g.rect(x, y, w, hgt); g.clip();
  g.fillStyle = css("--pin-span"); g.fillRect(x, y, w, hgt);
  g.strokeStyle = color; g.globalAlpha = 0.55; g.lineWidth = 1;
  for (let k = -hgt; k < w + hgt; k += 7) { g.beginPath(); g.moveTo(x + k, y + hgt); g.lineTo(x + k + hgt, y); g.stroke(); }
  g.restore();
}

/** One problem as a small two-lane picture: caller above, agent below, the problem hatched in red. @param {HTMLCanvasElement} cv @param {Call} c @param {Finding} f */
function drawMoment(cv, c, f) {
  if (!c.peaks) return;
  const H = 146;
  const { g, width } = prepare(cv, H);
  const total = c.audio_s || c.duration_s || 1;
  const end = f.end_s !== null && f.end_s > f.t_s ? f.end_s : f.t_s + 1.2;
  let a = Math.max(0, f.t_s - 2.2), b = Math.min(total, end + 3);
  if (b - a < 6) { b = Math.min(total, a + 6); a = Math.max(0, b - 6); }
  const x0 = 12, x1 = width - 12;
  /** @param {number} t */
  const X = (t) => x0 + ((t - a) / (b - a)) * (x1 - x0);
  const laneH = 38, yC = 30, yA = yC + laneH + 12;
  g.font = `600 12px ${FONT}`; g.textAlign = "left"; g.textBaseline = "middle";
  for (const [who, y, name] of /** @type {const} */ ([["caller", yC, "Caller"], ["agent", yA, "Agent"]])) {
    g.fillStyle = css("--sunk"); roundRect(g, x0, y, x1 - x0, laneH, 5); g.fill();
    for (const t of c.speech || []) {
      if (t.who !== who || t.end < a || t.start > b) continue;
      g.fillStyle = css(who === "caller" ? "--caller-block" : "--agent-block");
      const s = Math.max(x0, X(t.start)), e = Math.min(x1, X(t.end));
      roundRect(g, s, y, Math.max(2, e - s), laneH, 5); g.fill();
    }
    waveWindow(g, c.peaks[who], total, a, b, y, laneH, css(who === "caller" ? "--caller" : "--agent"), X, x0, x1);
    g.fillStyle = css("--quiet"); g.fillText(name, x0 + 6, y - 9);
  }
  // the problem itself
  const px = Math.max(x0, X(f.t_s)), pe = Math.min(x1, X(end));
  if (f.end_s !== null && pe > px) hatch(g, px, yC, pe - px, yA + laneH - yC, css("--over"));
  g.strokeStyle = css("--over"); g.lineWidth = 2;
  g.beginPath(); g.moveTo(px, yC - 4); g.lineTo(px, yA + laneH + 4); g.stroke();
  if (f.end_s !== null && pe > px) { g.beginPath(); g.moveTo(pe, yC - 4); g.lineTo(pe, yA + laneH + 4); g.stroke(); }
  g.lineWidth = 1;
  const word = (MOMENT_WORDS[f.metric] || ((d) => `${d.toFixed(2)} s`))(end - f.t_s);
  g.font = `650 13px ${FONT}`; g.fillStyle = css("--over-ink"); g.textBaseline = "alphabetic";
  const mid = (px + pe) / 2, tw = g.measureText(word).width;
  g.textAlign = "left";
  g.fillText(word, Math.min(x1 - tw, Math.max(x0, f.end_s !== null ? mid - tw / 2 : px + 6)), H - 8);
  g.textBaseline = "middle";
}

/** Bars for a stretch of one side's waveform. */
function waveWindow(/** @type {CanvasRenderingContext2D} */ g, /** @type {number[]} */ peaks, /** @type {number} */ total, /** @type {number} */ a, /** @type {number} */ b, /** @type {number} */ y, /** @type {number} */ hgt, /** @type {string} */ color, /** @type {(t: number) => number} */ X, /** @type {number} */ x0, /** @type {number} */ x1) {
  const per = total / peaks.length;
  const i0 = Math.max(0, Math.floor(a / per)), i1 = Math.min(peaks.length - 1, Math.ceil(b / per));
  const pxPer = (x1 - x0) / ((b - a) / per);
  const stride = Math.max(1, Math.floor(2 / pxPer));
  const mid = y + hgt / 2;
  g.fillStyle = color;
  for (let i = i0; i <= i1; i += stride) {
    let p = 0;
    for (let k = i; k < i + stride && k < peaks.length; k++) p = Math.max(p, peaks[k]);
    const v = (p / 100) * (hgt / 2 - 3);
    g.fillRect(X(i * per), mid - Math.max(0.5, v), Math.max(1, pxPer * stride - 0.6), Math.max(1, 2 * v));
  }
}

// ---------- every call: aligned tapes ----------

/** @type {{cv: HTMLCanvasElement, c: Call}[]} */
const tapeCanvases = [];

function renderWall() {
  if (CALLS.length === 1) return null;
  const longest = Math.max(1, ...CALLS.map((c) => c.audio_s || c.duration_s || 1));
  const groups = DATA.scenarios.map((s) => {
    const regressed = s.baseline.some((d) => d.regressed);
    const ok = s.passed && !regressed;
    const tapes = s.calls.map((c) => {
      const dur = c.audio_s || c.duration_s || 0;
      const cv = /** @type {HTMLCanvasElement} */ (h("canvas", { role: "img", "aria-hidden": "true", style: `width:${Math.max(8, (dur / longest) * 100)}%` }));
      tapeCanvases.push({ cv, c });
      return h("button", { class: "tape", title: "Open and play this call", "data-call": c.call_id, onclick: () => selectCall(c, true), "aria-label": `${s.scenario_id} trial ${c.trial}, ${c.error ? "could not run" : c.passed ? "on target" : "above target"}` }, [
        h("span", { class: "n num" }, [callMark(c), String(c.trial)]),
        h("span", { class: "strip" }, [cv]),
        h("span", { class: "t num" }, [glyph("play"), dur ? `${Math.round(dur)} s` : ""]),
      ]);
    });
    return h("div", { class: "scn" }, [
      h("div", { class: "scn-name" }, [
        h("b", {}, [pip(ok, ok ? "on target" : "above target"), s.scenario_id]),
        h("span", {}, [wallSummary(s)]),
      ]),
      h("div", { class: "tapes" }, tapes),
    ]);
  });
  const legend = h("p", { class: "legend" }, [
    h("span", {}, [h("i", { style: "background:var(--caller)" }), "Caller speaking"]),
    h("span", {}, [h("i", { style: "background:var(--agent)" }), "Agent speaking"]),
    h("span", {}, [h("i", { style: "background:var(--over);border-radius:0;width:3px;height:12px" }), "Above target here"]),
    h("span", {}, [h("i", { style: "background:var(--chaos);transform:rotate(45deg);border-radius:1px;width:8px;height:8px" }), "A disturbance Callback caused"]),
  ]);
  return section("calls", "Every call", "One row per call, all on the same clock, so a pattern shows at a glance. Select a call to open and play it.", [
    h("div", { class: "wall" }, groups), legend,
  ]);
}

/** "3 calls, all within their limits" for the wall's scenario column. @param {Scenario} s */
function wallSummary(s) {
  const n = s.calls.length, bad = s.calls.filter((c) => c.error || !c.passed).length;
  const calls = `${n} call${n === 1 ? "" : "s"}`;
  return bad === 0 ? `${calls}, on target` : bad === n ? `${calls}, above target` : `${calls}, ${bad} above target`;
}

/** @param {HTMLCanvasElement} cv @param {Call} c */
function drawTape(cv, c) {
  const total = c.audio_s || c.duration_s || 1;
  const { g, width } = prepare(cv, 34);
  /** @param {number} t */
  const X = (t) => 1 + (t / total) * (width - 2);
  g.fillStyle = css("--sunk"); roundRect(g, 0, 0, width, 34, 4); g.fill();
  for (const t of c.speech || []) {
    const y = t.who === "caller" ? 8 : 19;
    g.fillStyle = css(t.who === "caller" ? "--caller" : "--agent");
    roundRect(g, X(t.start), y, Math.max(1.5, X(t.end) - X(t.start)), 8, 2); g.fill();
  }
  g.fillStyle = css("--chaos");
  for (const m of c.chaos || []) diamond(g, X(m.t), 4, 3);
  for (const f of c.findings) {
    if (f.severity !== "fail") continue;
    g.fillStyle = css("--over");
    g.fillRect(X(f.t_s) - 0.75, 4, 1.5, 26);
  }
}

// ---------- the call ----------

const canvas = /** @type {HTMLCanvasElement} */ (h("canvas", { id: "timeline-canvas", role: "img", tabindex: "0" }));
const overview = /** @type {HTMLCanvasElement} */ (h("canvas", { id: "overview", "aria-label": "Whole call: click or drag to move the view" }));
const tip = h("div", { class: "tip", role: "tooltip" });
const callEl = h("div", { class: "player", id: "call", "aria-live": "polite" });

/** Choose any call without going back to the list. @param {Call} c */
function renderPicker(c) {
  if (CALLS.length < 2) return null;
  const i = CALLS.indexOf(c);
  const pick = h("select", { id: "callpick", "aria-label": "Choose a call", onchange: (e) => selectCall(CALLS[Number(/** @type {HTMLSelectElement} */ (e.target).value)]) },
    DATA.scenarios.map((s) => h("optgroup", { label: s.scenario_id }, s.calls.map((cc) => h("option", { value: String(CALLS.indexOf(cc)), selected: cc === c },
      [`Trial ${cc.trial}${cc.error ? " (could not run)" : cc.passed ? " (on target)" : " (above target)"}`])))));
  return h("div", { class: "picker" }, [
    h("button", { class: "tool", type: "button", onclick: () => nextCall(-1) }, ["‹ Previous call"]),
    pick,
    h("button", { class: "tool", type: "button", onclick: () => nextCall(1) }, ["Next call ›"]),
    h("span", { class: "quiet num" }, [`${i + 1} of ${CALLS.length} calls`]),
  ]);
}

/** A window of FOCUS_SPAN_S around t, a third of the way in. @param {number} t @param {number} total */
function around(t, total) {
  if (total <= FOCUS_SPAN_S * 1.5) return { t0: 0, t1: total };
  const t0 = Math.min(Math.max(0, t - FOCUS_SPAN_S / 3), total - FOCUS_SPAN_S);
  return { t0, t1: t0 + FOCUS_SPAN_S };
}

/** @param {Call} c @param {boolean} [focus] */
function selectCall(c, focus = false) {
  audio.pause();
  state.call = c;
  state.finding = primaryFinding(c);
  const total = c.audio_s || c.duration_s || 1;
  state.view = state.finding >= 0 ? around(c.findings[state.finding].t_s, total) : { t0: 0, t1: total };
  if (c.audio) audio.src = c.audio; else audio.removeAttribute("src");
  if (state.finding >= 0) audio.currentTime = Math.max(0, c.findings[state.finding].t_s - PRE_ROLL_S);
  for (const b of document.querySelectorAll(".tape")) b.setAttribute("aria-current", String(b.getAttribute("data-call") === c.call_id));
  try { history.replaceState(null, "", `#${encodeURIComponent(c.call_id)}`); } catch { /* file: URLs may refuse */ }
  renderCall();
  if (focus) { canvas.focus({ preventScroll: true }); document.getElementById("call")?.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

/** Open the call, jump to the moment and play it. @param {string} callId @param {number} t */
function hearAt(callId, t) {
  const c = CALLS.find((x) => x.call_id === callId);
  if (!c) return;
  if (state.call !== c) selectCall(c);
  const i = c.findings.findIndex((f) => Math.abs(f.t_s - t) < 0.01);
  if (i >= 0) jumpTo(i, true);
  else {
    audio.currentTime = Math.max(0, t - PRE_ROLL_S);
    state.view = around(t, c.audio_s || c.duration_s || 1);
    if (c.audio) audio.play();
    draw();
  }
  document.getElementById("call")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

const LAYOUT = { axis: 20, events: 44, lane: 62, gap: 6, gap2: 14, strip: 58, pad: 12 };

/** The row names beside the canvas, as real text; heights match LAYOUT. */
function rowLabels() {
  const L = LAYOUT;
  const limit = state.call ? state.call.latency_limit : null;
  /** @param {number} hgt @param {(Node|string|null)[]} kids */
  const row = (hgt, kids) => h("div", { class: "label", style: `height:${hgt}px` }, kids);
  return h("div", { class: "labels" }, [
    row(L.axis, []),
    row(L.events, [h("b", {}, ["Events", info("events")]), h("span", { class: "lsub" }, ["◆ on purpose · ▼ problem"])]),
    row(L.lane, [h("b", {}, [h("span", { class: "dot", style: `background:${css("--caller")}` }), "Caller", info("caller")]), h("span", { class: "lsub" }, ["left channel"])]),
    row(L.gap, []),
    row(L.lane, [h("b", {}, [h("span", { class: "dot", style: `background:${css("--agent")}` }), "Agent", info("agent")]), h("span", { class: "lsub" }, ["right channel"])]),
    row(L.gap2, []),
    row(L.strip, [h("b", {}, ["Wait before reply", info("wait")]), h("span", { class: "lsub" }, [limit ? `dashed line: ${limit} s limit` : "one bar per reply"])]),
    row(L.pad, []),
    row(30, [h("b", {}, ["Whole call"]), h("span", { class: "lsub" }, ["drag to move"])]),
  ]);
}

/** How precisely this call's chaos landed (a check on Callback itself). @param {Call} c */
function driftFact(c) {
  const m = (c.metrics || []).find((x) => x.name === "chaos_drift_max_s");
  if (!m || m.value === null || m.value === undefined) return null;
  const ms = Math.round(m.value * 1000);
  const late = m.threshold !== null && m.value > m.threshold;
  return h("span", {
    class: late ? "" : "quiet",
    style: late ? "color:var(--warn-ink);font-weight:600" : "",
    title: "How late the scheduled disturbances hit the line. A check on Callback itself, not the agent.",
  }, [late ? `Chaos landed up to ${ms} ms late (tolerance ${Math.round((m.threshold || 0) * 1000)} ms)` : `Chaos on time, within ${ms} ms`]);
}

function renderCall() {
  const c = state.call;
  if (!c) return;
  const facts = [
    c.duration_s !== undefined ? `${c.duration_s.toFixed(0)} s call` : null,
    c.end_reason ? `ended: ${c.end_reason.replace(/_/g, " ")}` : null,
    `seed ${c.seed}`,
  ].filter(Boolean);
  const sides = /** @type {const} */ (["both", "caller", "agent"]);
  const hearSeg = c.audio
    ? h("div", { class: "seg", role: "group", "aria-label": "Hear" }, sides.map((side, k) => h("button", {
      "data-side": side, "aria-pressed": String(hear === side), title: `Key ${k + 1}`, onclick: () => setHear(side),
    }, [side === "both" ? "Both sides" : side === "caller" ? "Caller only" : "Agent only"])))
    : h("span", { class: "quiet" }, ["Audio not embedded in this report"]);
  const playing = !audio.paused;
  callEl.replaceChildren(...[
    renderPicker(c),
    h("div", { class: "callhead" }, [callMark(c), h("h3", {}, [`${c.scenario_id}, trial ${c.trial}`])]),
    h("div", { class: "callfacts num" }, [...facts.map((f) => h("span", {}, [/** @type {string} */ (f)])), driftFact(c)]),
    c.error ? h("div", { class: "error-box" }, [c.error]) : null,
    c.peaks ? h("div", { class: "transport" }, [
      h("button", { class: "play", id: "play", onclick: togglePlay, "aria-label": playing ? "Pause" : "Play", title: "Play or pause (Space)" }, [glyph(playing ? "pause" : "bigplay")]),
      h("span", { class: "clock num", id: "time" }, [`${clock(audio.currentTime || 0)} / ${clock(c.audio_s || 0)}`]),
      hearSeg,
      h("span", { class: "hint" }, ["Click the timeline to listen from that point"]),
    ]) : null,
    c.peaks ? h("div", { class: "timeline" }, [rowLabels(), h("div", { style: "position:relative;min-width:0" }, [canvas, overview, tip])])
      : h("p", { class: "quiet" }, ["No recording for this call."]),
    renderProblems(c),
    c.remeasured ? h("p", { class: "note" }, ["Speech timings for this older run were re-measured from the recording with the same scorer."]) : null,
  ].filter((n) => n !== null));
  canvas.setAttribute("aria-label", `Timeline of ${c.call_id} with ${c.findings.length} problems. N and P move between problems, Space plays.`);
  requestAnimationFrame(draw);
}

/** Problems in this call, with repeats grouped. @param {Call} c */
function renderProblems(c) {
  if (!c.findings.length) {
    const why = c.failure_reasons.length ? c.failure_reasons.join(" ") : "Nothing in this call went above target.";
    return h("p", { class: c.passed ? "okline" : "failline" }, [why]);
  }
  const list = h("ul", { class: "problems", "aria-label": "What went above target in this call" });
  for (const g of groupFindings(c)) {
    const first = c.findings[g.items[0]];
    const mark = h("span", { class: "sev" }, [icon(g.severity === "fail" ? "fail" : "warn", g.severity === "fail" ? "problem" : "warning")]);
    if (g.items.length === 1) {
      const i = g.items[0];
      list.append(h("li", {}, [h("button", { class: "prob", "data-i": String(i), onclick: () => jumpTo(i, true) }, [
        h("span", { class: "when" }, [clock(first.t_s)]), mark, h("span", { class: "kind" }, [g.label]), h("span", {}, [first.message]),
      ])]));
      continue;
    }
    list.append(h("li", {}, [
      h("button", { class: "prob", "data-group": g.key, onclick: () => jumpTo(g.items[0], true) }, [
        h("span", { class: "when" }, [clock(first.t_s)]), mark,
        h("span", { class: "kind" }, [g.label, " ", h("span", { class: "count" }, [`×${g.items.length}`])]),
        h("span", { class: "quiet" }, [groupRange(c, g) || first.message]),
      ]),
      h("div", { class: "times", role: "group", "aria-label": `${g.label}: each time` }, g.items.map((i) => h("button", {
        class: "chip", "data-i": String(i), onclick: () => jumpTo(i, true), title: c.findings[i].message,
      }, [clock(c.findings[i].t_s)]))),
    ]));
  }
  queueMicrotask(markCurrent);
  return list;
}

/** Highlight the current problem: its row, or its group row and its time chip. */
function markCurrent() {
  for (const b of document.querySelectorAll(".prob, .chip")) {
    const i = b.getAttribute("data-i");
    let current = i !== null && Number(i) === state.finding;
    if (!current && b.hasAttribute("data-group")) {
      const chips = b.parentElement ? b.parentElement.querySelectorAll(".chip") : [];
      current = [...chips].some((ch) => Number(ch.getAttribute("data-i")) === state.finding);
    }
    b.setAttribute("aria-current", String(current));
  }
}

// ---------- the timeline canvas ----------

/** @type {{x0: number, x1: number}} */
let geom = { x0: 0, x1: 0 };
/** @type {{x: number, y: number, r: number, text: string, t: number, pin?: number}[]} */
let hits = [];

/** Size a canvas for the device pixel ratio and return its 2D context. @param {HTMLCanvasElement} cv @param {number} height */
function prepare(cv, height) {
  const dpr = window.devicePixelRatio || 1;
  const width = cv.clientWidth || 800;
  if (cv.width !== Math.round(width * dpr) || cv.height !== Math.round(height * dpr)) {
    cv.width = Math.round(width * dpr);
    cv.height = Math.round(height * dpr);
    cv.style.height = `${height}px`;
  }
  const g = /** @type {CanvasRenderingContext2D} */ (cv.getContext("2d"));
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, width, height);
  g.font = `12px ${FONT}`;
  g.textBaseline = "middle";
  return { g, width };
}

const FONT = "system-ui, -apple-system, Segoe UI, sans-serif";

function draw() {
  const c = state.call;
  if (!c || !c.peaks || !canvas.isConnected) return;
  const L = LAYOUT;
  const { g, width } = prepare(canvas, L.axis + L.events + 2 * L.lane + L.gap + L.gap2 + L.strip + L.pad);
  hits = [];
  const x0 = 4, x1 = width - 8;
  const { t0, t1 } = state.view;
  /** @param {number} t */
  const X = (t) => x0 + ((t - t0) / (t1 - t0)) * (x1 - x0);
  const yEvents = L.axis;
  const yCaller = yEvents + L.events;
  const yAgent = yCaller + L.lane + L.gap;
  const yStrip = yAgent + L.lane + L.gap2;
  const yEnd = yStrip + L.strip;
  geom = { x0, x1 };
  const span = t1 - t0;

  // time axis and gridlines
  const step = [0.5, 1, 2, 5, 10, 15, 30, 60].find((s) => span / s <= 10) || 120;
  g.strokeStyle = css("--hairline");
  g.fillStyle = css("--muted");
  g.textAlign = "center";
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    const x = Math.round(X(t)) + 0.5;
    g.beginPath(); g.moveTo(x, L.axis - 2); g.lineTo(x, yEnd); g.stroke();
    if (x > x0 + 16 && x < x1 - 16) g.fillText(clock(t).replace(/\.0$/, ""), x, 9);
  }

  // the selected problem's span, behind everything
  const sel = state.finding >= 0 ? c.findings[state.finding] : null;
  if (sel && sel.end_s !== null && sel.end_s > sel.t_s) {
    const a = Math.max(x0, X(sel.t_s)), b = Math.min(x1, X(sel.end_s));
    if (b > a) hatch(g, a, yCaller, b - a, yAgent + L.lane - yCaller, css("--over"));
  }

  // speech blocks and waveforms
  for (const t of c.speech || []) {
    if (t.end < t0 || t.start > t1) continue;
    const y = t.who === "caller" ? yCaller : yAgent;
    const a = Math.max(x0, X(t.start)), b = Math.min(x1, X(t.end));
    g.fillStyle = css(t.who === "caller" ? "--caller-block" : "--agent-block");
    roundRect(g, a, y, Math.max(2, b - a), L.lane, 5);
    g.fill();
    const who = t.who === "caller" ? "Caller" : "Agent";
    hits.push({ x: (a + b) / 2, y: y + L.lane / 2, r: Math.max(6, (b - a) / 2), text: `${t.text ? `${who}: “${t.text}”` : `${who} speaking`} (${clock(t.start)}–${clock(t.end)})`, t: t.start });
  }
  drawWave(g, c.peaks.caller, c.audio_s || 1, yCaller, L.lane, css("--caller"), X, x0, x1);
  drawWave(g, c.peaks.agent, c.audio_s || 1, yAgent, L.lane, css("--agent"), X, x0, x1);

  // events row: chaos flags and problem pins, labelled where there is room
  /** @type {{x: number, t: number, kind: "chaos"|"pin", label: string, text: string, i?: number, sev?: string}[]} */
  const marks = [];
  for (const m of c.chaos || []) {
    if (m.t < t0 || m.t > t1) continue;
    const name = m.type.replace(/_/g, "-");
    const label = name.charAt(0).toUpperCase() + name.slice(1) + (m.phase ? ` ${m.phase}` : "");
    marks.push({ x: X(m.t), t: m.t, kind: "chaos", label, text: `Chaos · ${label}${m.text ? `: “${m.text}”` : ""} at ${clock(m.t)}` });
  }
  c.findings.forEach((f, i) => {
    if (f.t_s < t0 || f.t_s > t1) return;
    marks.push({ x: X(f.t_s), t: f.t_s, kind: "pin", label: findingLabel(f), text: f.message, i, sev: f.severity });
  });
  // the selected problem claims its label slot first; the rest fill in left to right
  marks.sort((a, b) => (a.i === state.finding ? -1 : b.i === state.finding ? 1 : a.x - b.x));
  /** @type {[number, number][][]} label spans already taken, per level */
  const levels = [[], []];
  for (const m of marks) {
    const active = m.kind === "pin" && m.i === state.finding;
    g.font = `${active ? 700 : 600} 11.5px ${FONT}`;
    const end = m.x + 9 + g.measureText(m.label).width;
    const level = span <= 40 ? levels.findIndex((taken) => taken.every(([a, b]) => end + 6 < a || m.x - 8 > b)) : -1;
    if (level >= 0) levels[level].push([m.x - 8, end]);
    // no room for a label: keep the marker only where it doesn't sit on someone's label
    const bare = level < 0 ? levels.findIndex((taken) => taken.every(([a, b]) => m.x < a - 7 || m.x > b + 7)) : level;
    const y = bare === 1 ? yEvents + 31 : yEvents + 12;
    const col = m.kind === "chaos" ? css("--chaos") : css(m.sev === "fail" ? "--critical" : "--warn");
    g.strokeStyle = col;
    g.globalAlpha = m.kind === "chaos" ? 0.9 : active ? 1 : 0.5;
    g.lineWidth = active ? 2 : 1;
    if (m.kind === "chaos") g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(m.x, bare >= 0 ? y + 6 : yCaller); g.lineTo(m.x, yAgent + L.lane); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1; g.lineWidth = 1;
    if (bare >= 0) {
      if (m.kind === "chaos") { g.fillStyle = col; diamond(g, m.x, y, 5); } else pin(g, m.x, y + 5, col, active);
    }
    if (level >= 0) {
      g.fillStyle = m.kind === "chaos" ? css("--ink-2") : css(m.sev === "fail" ? "--critical-ink" : "--warn-ink");
      g.textAlign = "left";
      g.fillText(m.label, m.x + 9, y);
    }
    hits.push({ x: m.x, y, r: 10, text: m.text, t: m.t, pin: m.i });
  }
  g.font = `12px ${FONT}`;

  // wait before reply: one bar per answered caller turn, against the limit
  const pts = c.latency || [];
  const limit = c.latency_limit || null;
  const vmax = Math.max(limit ? limit * 1.5 : 0, ...pts.map((p) => p.v), 0.5);
  const barW = Math.max(6, Math.min(14, (x1 - x0) / (span * 2)));
  g.strokeStyle = css("--axis");
  g.beginPath(); g.moveTo(x0, yEnd + 0.5); g.lineTo(x1, yEnd + 0.5); g.stroke();
  for (const p of pts) {
    if (p.t < t0 || p.t > t1) continue;
    const hgt = (p.v / vmax) * (L.strip - 6);
    const over = limit !== null && p.v > limit;
    g.fillStyle = over ? css("--critical") : css("--agent");
    roundTop(g, X(p.t) - barW / 2, yEnd - hgt, barW, hgt, 3);
    g.fill();
    if (span <= 40) {
      g.fillStyle = over ? css("--critical-ink") : css("--ink-2");
      g.textAlign = "left";
      g.fillText(`${p.v.toFixed(2)} s`, X(p.t) + barW / 2 + 4, yEnd - hgt + 7);
    }
    hits.push({ x: X(p.t), y: yEnd - hgt / 2, r: Math.max(8, hgt / 2), text: `The caller waited ${p.v.toFixed(2)} s for a reply${over ? ` (limit ${limit} s)` : ""}, at ${clock(p.t)}`, t: p.t });
  }
  if (limit !== null) {
    const y = Math.round(yEnd - (limit / vmax) * (L.strip - 6)) + 0.5;
    g.strokeStyle = css("--critical");
    g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.setLineDash([]);
  }

  // playhead
  const now = audio.currentTime || 0;
  if (now >= t0 && now <= t1) {
    const x = Math.round(X(now)) + 0.5;
    g.strokeStyle = css("--playhead");
    g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, L.axis - 4); g.lineTo(x, yEnd); g.stroke();
    g.lineWidth = 1;
  }
  const timeEl = document.getElementById("time");
  if (timeEl) timeEl.textContent = `${clock(now)} / ${clock(c.audio_s || 0)}`;
  drawOverview(c);
}

/** The whole call in one strip: speech, problems, chaos, and the visible window. @param {Call} c */
function drawOverview(c) {
  const total = c.audio_s || c.duration_s || 1;
  const { g, width } = prepare(overview, 30);
  const x0 = 4, x1 = width - 8;
  /** @param {number} t */
  const X = (t) => x0 + (t / total) * (x1 - x0);
  for (const t of c.speech || []) {
    g.fillStyle = css(t.who === "caller" ? "--caller" : "--agent");
    g.fillRect(X(t.start), t.who === "caller" ? 9 : 16, Math.max(1, X(t.end) - X(t.start)), 5);
  }
  g.fillStyle = css("--chaos");
  for (const m of c.chaos || []) diamond(g, X(m.t), 4, 3);
  c.findings.forEach((f, i) => {
    g.fillStyle = css(f.severity === "fail" ? "--critical" : "--warn");
    g.fillRect(X(f.t_s) - (i === state.finding ? 1.5 : 1), 23, i === state.finding ? 3 : 2, 6);
  });
  const { t0, t1 } = state.view;
  if (t0 > 0 || t1 < total) {
    g.strokeStyle = css("--ink-2");
    g.lineWidth = 1.5;
    roundRect(g, X(t0), 1, Math.max(4, X(t1) - X(t0)), 28, 4);
    g.stroke();
    g.lineWidth = 1;
  }
  g.fillStyle = css("--playhead");
  g.fillRect(X(audio.currentTime || 0) - 0.75, 0, 1.5, 30);
}

/**
 * @param {CanvasRenderingContext2D} g @param {number[]} peaks @param {number} total
 * @param {number} y @param {number} hgt @param {string} color
 * @param {(t: number) => number} X @param {number} x0 @param {number} x1
 */
function drawWave(g, peaks, total, y, hgt, color, X, x0, x1) {
  const mid = y + hgt / 2;
  const per = total / peaks.length;
  const { t0, t1 } = state.view;
  const i0 = Math.max(0, Math.floor(t0 / per));
  const i1 = Math.min(peaks.length - 1, Math.ceil(t1 / per));
  const pxPer = (x1 - x0) / ((t1 - t0) / per);
  const stride = Math.max(1, Math.floor(1.5 / pxPer));
  g.fillStyle = color;
  for (let i = i0; i <= i1; i += stride) {
    let p = 0;
    for (let k = i; k < i + stride && k < peaks.length; k++) p = Math.max(p, peaks[k]);
    const a = (p / 100) * (hgt / 2 - 3);
    g.fillRect(X(i * per), mid - Math.max(0.5, a), Math.max(1, pxPer * stride - 0.5), Math.max(1, 2 * a));
  }
}
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} w @param {number} hh @param {number} r */
function roundRect(g, x, y, w, hh, r) { g.beginPath(); g.roundRect(x, y, w, hh, Math.min(r, w / 2)); }
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} w @param {number} hh @param {number} r */
function roundTop(g, x, y, w, hh, r) { g.beginPath(); g.roundRect(x, y, w, Math.max(1, hh), [Math.min(r, hh), Math.min(r, hh), 0, 0]); }
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {number} r */
function diamond(g, x, y, r) { g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill(); }
/** @param {CanvasRenderingContext2D} g @param {number} x @param {number} y @param {string} col @param {boolean} active */
function pin(g, x, y, col, active) {
  const r = active ? 7 : 5.5;
  g.fillStyle = col;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x - r, y - r * 1.6); g.lineTo(x + r, y - r * 1.6); g.closePath(); g.fill();
  g.strokeStyle = css("--surface"); g.lineWidth = 1.5; g.stroke(); g.lineWidth = 1;
}

// ---------- interaction ----------

/** @param {MouseEvent} e */
function timeAt(e) {
  const rect = canvas.getBoundingClientRect();
  const f = (e.clientX - rect.left - geom.x0) / (geom.x1 - geom.x0);
  return state.view.t0 + Math.min(1, Math.max(0, f)) * (state.view.t1 - state.view.t0);
}
/** @param {number} x @param {number} y */
function nearestHit(x, y) {
  let best = null, bestD = Infinity;
  for (const hit of hits) {
    const d = Math.hypot(hit.x - x, (hit.y - y) * 1.6);
    const small = hit.r <= 10;
    if (d <= (small ? 14 : hit.r) && (small ? d : d + 20) < bestD) { best = hit; bestD = small ? d : d + 20; }
  }
  return best;
}
canvas.addEventListener("click", (e) => {
  if (!state.call || !state.call.audio) return;
  const rect = canvas.getBoundingClientRect();
  const hit = nearestHit(e.clientX - rect.left, e.clientY - rect.top);
  if (hit && hit.pin !== undefined) { jumpTo(hit.pin, true); return; }
  const small = hit !== null && hit.r <= 10;
  audio.currentTime = Math.max(0, (small && hit ? hit.t - PRE_ROLL_S : timeAt(e)));
  audio.play();
});
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hit = nearestHit(x, y);
  if (!hit) { tip.style.display = "none"; return; }
  tip.textContent = hit.text;
  tip.style.display = "block";
  tip.style.left = `${Math.min(rect.width - tip.offsetWidth - 4, Math.max(4, x + 12))}px`;
  tip.style.top = `${Math.max(0, y - tip.offsetHeight - 10)}px`;
});
canvas.addEventListener("mouseleave", () => { tip.style.display = "none"; });
canvas.addEventListener("wheel", (e) => {
  if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoom(e.deltaY > 0 ? 1.25 : 0.8, timeAt(e));
  else pan((e.deltaX / canvas.clientWidth) * (state.view.t1 - state.view.t0));
}, { passive: false });

/** @param {MouseEvent} e */
function moveWindow(e) {
  const c = state.call;
  if (!c) return;
  const total = c.audio_s || c.duration_s || 1;
  const rect = overview.getBoundingClientRect();
  const t = Math.min(1, Math.max(0, (e.clientX - rect.left - 4) / (rect.width - 12))) * total;
  let span = state.view.t1 - state.view.t0;
  if (span >= total) span = Math.min(total, FOCUS_SPAN_S);
  const t0 = Math.min(Math.max(0, t - span / 2), total - span);
  state.view = { t0, t1: t0 + span };
  draw();
}
overview.addEventListener("mousedown", (e) => {
  moveWindow(e);
  /** @param {MouseEvent} ev */
  const move = (ev) => moveWindow(ev);
  const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

/** @param {number} factor @param {number} [centreAt] */
function zoom(factor, centreAt) {
  const c = state.call;
  if (!c) return;
  const total = c.audio_s || c.duration_s || 1;
  const { t0, t1 } = state.view;
  const centre = centreAt ?? (audio.currentTime || (t0 + t1) / 2);
  const span = Math.min(total, Math.max(2, (t1 - t0) * factor));
  const a = Math.min(Math.max(0, centre - (centre - t0) * (span / (t1 - t0))), total - span);
  state.view = { t0: a, t1: a + span };
  draw();
}
/** @param {number} dt */
function pan(dt) {
  const c = state.call;
  if (!c) return;
  const total = c.audio_s || c.duration_s || 1;
  const span = state.view.t1 - state.view.t0;
  const a = Math.min(Math.max(0, state.view.t0 + dt), total - span);
  state.view = { t0: a, t1: a + span };
  draw();
}

// ---------- listening ----------

/** @type {"both"|"caller"|"agent"} */
let hear = "both";
/** @type {{ctx: AudioContext, gains: GainNode[]}|null} */
let graph = null;
/** Route the stereo recording: as recorded, or one side in both ears (built on first use). */
function route() {
  if (!graph) {
    const Ctx = window.AudioContext || /** @type {any} */ (window).webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const source = ctx.createMediaElementSource(audio);
    const split = ctx.createChannelSplitter(2);
    const merge = ctx.createChannelMerger(2);
    source.connect(split);
    // gains: caller→left, caller→right, agent→left, agent→right
    const gains = [0, 1, 0, 1].map((out, k) => {
      const gain = ctx.createGain();
      split.connect(gain, k < 2 ? 0 : 1);
      gain.connect(merge, 0, out);
      return gain;
    });
    merge.connect(ctx.destination);
    graph = { ctx, gains };
  }
  const levels = hear === "both" ? [1, 0, 0, 1] : hear === "caller" ? [1, 1, 0, 0] : [0, 0, 1, 1];
  graph.gains.forEach((gain, k) => { gain.gain.value = levels[k]; });
  if (graph.ctx.state === "suspended") graph.ctx.resume();
}
/** @param {"both"|"caller"|"agent"} side */
function setHear(side) {
  hear = side;
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.getAttribute("data-side") === side));
  if (graph || side !== "both") route();
}
function togglePlay() {
  if (!state.call || !state.call.audio) return;
  if (audio.paused) audio.play(); else audio.pause();
}
/** @param {number} i @param {boolean} play */
function jumpTo(i, play) {
  const c = state.call;
  if (!c || i < 0 || i >= c.findings.length) return;
  state.finding = i;
  const f = c.findings[i];
  audio.currentTime = Math.max(0, f.t_s - PRE_ROLL_S);
  state.view = around(f.t_s, c.audio_s || c.duration_s || 1);
  markCurrent();
  if (play && c.audio) audio.play();
  draw();
}
/** @param {number} dir */
function nextProblem(dir) {
  const c = state.call;
  if (!c || !c.findings.length) return;
  const n = c.findings.length;
  jumpTo(state.finding < 0 ? (dir > 0 ? 0 : n - 1) : (state.finding + dir + n) % n, true);
}
/** @param {number} dir */
function nextCall(dir) {
  if (!CALLS.length) return;
  const i = CALLS.indexOf(/** @type {Call} */ (state.call));
  selectCall(CALLS[(i + dir + CALLS.length) % CALLS.length]);
}
function tick() {
  draw();
  const c = state.call;
  if (c && !audio.paused) {
    const { t0, t1 } = state.view;
    if (audio.currentTime > t1 - (t1 - t0) * 0.05) pan(audio.currentTime - t0 - (t1 - t0) * 0.1);
    state.raf = requestAnimationFrame(tick);
  } else state.raf = null;
}
/** @param {boolean} playing */
function setPlayButton(playing) {
  const b = document.getElementById("play");
  if (!b) return;
  b.replaceChildren(glyph(playing ? "pause" : "bigplay"));
  b.setAttribute("aria-label", playing ? "Pause" : "Play");
}
audio.addEventListener("play", () => {
  if (hear !== "both" || graph) route();
  setPlayButton(true);
  if (state.raf === null) state.raf = requestAnimationFrame(tick);
});
audio.addEventListener("pause", () => { setPlayButton(false); draw(); });
audio.addEventListener("seeked", () => draw());

document.addEventListener("keydown", (e) => {
  const target = /** @type {HTMLElement} */ (e.target);
  if (e.metaKey || e.ctrlKey || e.altKey || ["INPUT", "TEXTAREA"].includes(target.tagName)) return;
  if (help.open && e.key !== "?") return;
  const k = e.key;
  if (k === " " && target.tagName !== "BUTTON" && target.tagName !== "SUMMARY") { e.preventDefault(); togglePlay(); }
  else if (k === "n" || k === "N") nextProblem(1);
  else if (k === "p" || k === "P") nextProblem(-1);
  else if (k === "j" || k === "J") nextCall(1);
  else if (k === "k" || k === "K") nextCall(-1);
  else if (k === "ArrowRight" || k === "ArrowLeft") {
    e.preventDefault();
    audio.currentTime = Math.max(0, (audio.currentTime || 0) + (k === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 5 : 1));
    draw();
  }
  else if (k === "+" || k === "=") zoom(0.66);
  else if (k === "-" || k === "_") zoom(1.5);
  else if (k === "0") { const c = state.call; if (c) { state.view = { t0: 0, t1: c.audio_s || c.duration_s || 1 }; draw(); } }
  else if (k === "1") setHear("both");
