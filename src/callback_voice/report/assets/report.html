  else if (k === "2") setHear("caller");
  else if (k === "3") setHear("agent");
  else if (k === "t" || k === "T") toggleTheme();
  else if (k === "?") { if (help.open) help.close(); else help.showModal(); }
});

// ---------- the numbers ----------

/** @param {Scenario} s */
function renderScenarioNumbers(s) {
  const regressed = s.baseline.some((d) => d.regressed);
  const ok = s.passed && !regressed;
  const diffs = new Map(s.baseline.map((d) => [d.metric, d]));
  const hasBase = !!DATA.run.baseline_name;
  const rows = s.aggregates.flatMap((a) => {
    const d = diffs.get(a.name);
    const term = METRIC_TERMS[a.name];
    return [
      h("div", { class: "mname" }, [METRIC_LABELS[a.name] || a.name, term ? info(term) : null]),
      gauge(a),
      h("div", { class: "mval num mlim" }, [
        h("b", {}, [fmt(a.value, a.unit)]),
        h("small", {}, [[
          a.ci_low !== null && a.ci_high !== null ? `95% range ${fmt(a.ci_low, a.unit)} to ${fmt(a.ci_high, a.unit)}` : "",
          a.threshold !== null ? `limit ${a.comparator === "<=" ? "≤" : "≥"} ${fmt(a.threshold, a.unit)}` : "",
          hasBase && d ? diffText(d, a.unit) : "",
        ].filter(Boolean).join(" · ")]),
      ]),
      a.passed === null ? h("span", { class: "quiet" }, ["–"]) : h("span", { class: `quiet`, style: "font-size:13px" }, [a.passed ? "within" : "over"]),
      h("span", {}, []),
    ];
  });
  return h("details", { class: "nscn" }, [
    h("summary", {}, [pip(ok, ok ? "on target" : "above target"), h("b", {}, [s.scenario_id]), h("span", { class: "s" }, [`${s.agent}, ${s.calls.length} call${s.calls.length === 1 ? "" : "s"}. ${s.sentence}`]), h("span", { class: "chev" }, [])]),
    rows.length ? h("div", { class: "metrics" }, [
      ...rows,
    ]) : h("p", { class: "quiet", style: "padding:0 0 22px 38px" }, ["No across-call numbers: this run was made by an older Callback."]),
  ]);
}
/** @param {Diff} d @param {string} unit */
function diffText(d, unit) {
  if (d.delta === null) return d.direction;
  const arrow = d.direction === "same" ? "=" : d.delta > 0 ? "up" : "down";
  const mag = fmt(Math.abs(d.delta), unit);
  return d.regressed ? `${arrow} ${mag} vs baseline: worse, beyond noise` : `${arrow} ${mag} vs baseline${d.direction === "worse" ? " (noise)" : ""}`;
}
/** A value on a line with its 95% range and its limit. @param {Aggregate} a */
function gauge(a) {
  const hi = Math.max(a.threshold !== null ? a.threshold * 1.6 : 0, a.value ?? 0, a.ci_high ?? 0, a.unit === "ratio" ? 0.1 : 0.5);
  const top = a.unit === "ratio" && a.comparator === ">=" ? 1 : hi * 1.08;
  /** @param {number} v */
  const pos = (v) => `${Math.min(100, Math.max(0, (v / top) * 100))}%`;
  const kids = [h("div", { class: "track" })];
  if (a.ci_low !== null && a.ci_high !== null) kids.push(h("div", { class: "whisker", style: `left:${pos(a.ci_low)};width:calc(${pos(a.ci_high)} - ${pos(a.ci_low)})` }));
  if (a.threshold !== null) kids.push(h("div", { class: "limit", style: `left:${pos(a.threshold)}` }));
  if (a.value !== null) kids.push(h("div", { class: `val ${a.passed === false ? "bad" : a.passed ? "good" : ""}`, style: `left:${pos(a.value)}` }));
  return h("div", { class: "gauge", role: "img", "aria-label": `${fmt(a.value, a.unit)}${a.threshold !== null ? `, limit ${fmt(a.threshold, a.unit)}` : ""}` }, kids);
}
function renderNumbers() {
  const terms = ["p95", "p50", "range", "limit", "wait", "unanswered", "yield", "talkover", "falseyield", "silence", "passed", "events"];
  return section("numbers", "The numbers", "Across the calls of each scenario. The dot is the value, the whisker its 95% range, the dashed line the limit.", [
    h("div", {}, DATA.scenarios.map(renderScenarioNumbers)),
    h("details", { class: "howto" }, [
      h("summary", {}, ["How to read this page"]),
      h("dl", { class: "glossary" }, terms.flatMap((k) => [h("dt", {}, [GLOSSARY[k][0]]), h("dd", {}, [GLOSSARY[k][1]])])),
      h("p", { class: "note" }, ["Everything is measured from the recording, not from the agent's logs. Only hard checks with a limit can fail a run; AI-judged scores are informational."]),
    ]),
  ]);
}

// ---------- theme and redraw ----------

function redrawAll() {
  for (const m of momentCanvases) drawMoment(m.cv, m.c, m.f);
  for (const t of tapeCanvases) drawTape(t.cv, t.c);
  renderCall();
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("callback-report-theme", root.dataset.theme); } catch { /* storage may be blocked */ }
  redrawAll();
}
try {
  const saved = localStorage.getItem("callback-report-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
} catch { /* storage may be blocked */ }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => redrawAll());
let resizeTimer = 0;
window.addEventListener("resize", () => {
  draw();
  clearTimeout(resizeTimer);
  resizeTimer = window.setTimeout(() => { for (const m of momentCanvases) drawMoment(m.cv, m.c, m.f); for (const t of tapeCanvases) drawTape(t.cv, t.c); }, 80);
});

// ---------- start ----------

document.title = `${DATA.run.exit_code === 0 ? "On target" : DATA.run.exit_code === 1 ? "Above target" : "Could not run"}: Callback run ${DATA.run.run_id}`;
app.append(
  ...[renderMasthead(), renderVerdict(), renderChecks(), renderFindings(), renderWall()].filter((n) => n !== null),
  h("section", { class: "section", id: "open" }, [
    h("div", { class: "sechead" }, [h("h2", {}, [CALLS.length > 1 ? "Listen to a call" : "The call"]), h("p", { class: "sub" }, ["The two sides of the recording on one timeline. Anything that went above target is pinned; select one to hear it."])]),
    callEl,
  ]),
  renderNumbers(),
  h("p", { class: "foot" }, [`Callback ${DATA.run.callback_version}. Measured from the recordings, not from the agent's logs.`]),
);
for (const m of momentCanvases) drawMoment(m.cv, m.c, m.f);
for (const t of tapeCanvases) drawTape(t.cv, t.c);
const linked = CALLS.find((c) => `#${c.call_id}` === decodeURIComponent(location.hash));
const worst = DATA.summary.tiles.length ? CALLS.find((c) => c.call_id === DATA.summary.tiles[0].call_id) : undefined;
const first = linked || worst || CALLS.find((c) => c.error || !c.passed) || CALLS[0];
if (first) selectCall(first);
requestAnimationFrame(() => { for (const m of momentCanvases) drawMoment(m.cv, m.c, m.f); for (const t of tapeCanvases) drawTape(t.cv, t.c); });
</script>
</body>
