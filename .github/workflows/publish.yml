name: publish

# Publishes callback-voice with PyPI trusted publishing (OIDC): no API token is stored
# anywhere. Run it by hand with index = testpypi first; it uploads to TestPyPI and then
# installs that upload on fresh Ubuntu and macOS runners. Publishing a GitHub release
# (tag vX.Y.Z matching the version in pyproject.toml) uploads to PyPI.

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Version from pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "callback-voice $version"
      - name: A release tag must match that version
        if: github.event_name == 'release'
        run: |
          if [ "${{ github.event.release.tag_name }}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "tag ${{ github.event.release.tag_name }} does not match version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/callback-voice/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Only our package comes from TestPyPI (--no-deps); its dependencies come from PyPI,
  # so a look-alike package uploaded to TestPyPI can't be installed by accident.
  check-testpypi:
    needs: [build, testpypi]
    name: install from TestPyPI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the upload from TestPyPI
        run: |
          for i in $(seq 1 20); do
            python -m pip download --no-deps --dest wheel \
              --index-url https://test.pypi.org/simple/ \
              "callback-voice==${{ needs.build.outputs.version }}" && break
            sleep 15  # a new upload takes a moment to appear in the index
          done
          ls wheel/*.whl
      - name: Install it with its dependencies from PyPI
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/pip install "$(ls wheel/*.whl)[local]"
      - run: venv/bin/callback --version
      - run: venv/bin/callback doctor

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.index == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/callback-voice/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
