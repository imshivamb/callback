name: clean-install

# What a new user does, on fresh machines: build the package, install it with plain
# pip (no uv, no caches, models downloaded on first use), run `callback demo`. The
# demo calls the bundled buggy agent, so success here means exit code 1 and a report.
# On Windows no espeak-ng is installed: the run checks that the copy bundled with the
# `local` extra is found. The last step prints the chaos timing drift of each call.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  demo:
    needs: build
    name: demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: espeak-ng (the local voice's system dependency)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y espeak-ng
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install espeak-ng
          else echo "Windows: none installed; the bundled copy must be found"; fi
      - name: pip install callback-voice[local] from the built wheel
        run: |
          python -m venv venv
          bin=venv/bin
          if [ "$RUNNER_OS" = "Windows" ]; then bin=venv/Scripts; fi
          echo "VENV_BIN=$PWD/$bin" >> "$GITHUB_ENV"
          "$bin/python" -m pip install --upgrade pip
          "$bin/pip" install "$(ls dist/*.whl)[local]"
      - run: '"$VENV_BIN/callback" --version'
      - run: '"$VENV_BIN/callback" doctor'
      - name: callback demo (expects exit 1 and a report)
        run: |
          mkdir try && cd try
          set +e
          "$VENV_BIN/callback" demo --no-open
          code=$?
          set -e
          echo "exit code: $code"
          ls .callback/runs/*/report.html
          test "$code" -eq 1
      - name: Chaos timing drift per call (limit 0.1 s)
        if: always()
        run: |
          "$VENV_BIN/python" - <<'EOF'
          import glob, json
          for path in glob.glob("try/.callback/runs/*/results.json"):
              for scenario in json.load(open(path, encoding="utf-8"))["scenarios"]:
                  for trial in scenario["trials"]:
                      drift = [m for m in trial["metrics"] if m["name"] == "chaos_drift_max_s"]
                      print(scenario["scenario_id"], "chaos_drift_max_s", drift[0]["value"] if drift else None)
          for path in glob.glob("try/.callback/runs/*/calls/*/events.jsonl"):
              for line in open(path, encoding="utf-8"):
                  if '"clock_drift"' in line:
                      print("clock_drift event:", path, line.strip())
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report-${{ matrix.os }}
          path: |
            try/.callback/runs/**/report.html
            try/.callback/runs/**/results.json
            try/.callback/runs/**/events.jsonl
            try/.callback/demo-agent-logs/
          include-hidden-files: true
          if-no-files-found: ignore
