name: ci

# Fast checks on every push: lint, types, and the tests that need no speech models
# and no API keys (CLI behaviour and scoring on the committed fixture calls). Tests
# that need the local speech models skip themselves without the `local` extra. The
# full end-to-end suite with real calls is the manual `e2e` workflow.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - name: Fast tests (no speech models, no API keys)
        run: uv run pytest -rs
