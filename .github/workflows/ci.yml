name: ci

# Fast checks on every push: lint, types, and the tests that need no speech models
# and no API keys (CLI behaviour and scoring on the committed fixture calls). Tests
# that need the local speech models skip themselves without the `local` extra. The
# full end-to-end suite with real calls is the manual `e2e` workflow. The install check
# below installs the built wheel with plain pip and no extras: it proves the package
# installs and starts, without speech-model downloads. `callback demo` needs those
# models, so it runs in `clean-install` (manual and on release). The tick-clock step
# measures how late the caller's 20 ms clock runs on each OS; it is informational.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash  # Git Bash on Windows, so every step reads the same on all three
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }} --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - name: Fast tests (no speech models, no API keys)
        run: uv run pytest -rs
      - name: Install check (built wheel, plain pip, no extras, no keys)
        run: |
          uv build --wheel -o dist
          uv venv --seed --python ${{ matrix.python }} "$RUNNER_TEMP/smoke"
          bin="$RUNNER_TEMP/smoke/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/smoke/Scripts"; fi
          "$bin/pip" install dist/*.whl
          "$bin/python" -c "import callback_voice"
          "$bin/callback" --version
          "$bin/callback" doctor
      - name: Tick clock lateness (informational, limit 0.1 s)
        run: |
          uv run python scripts/measure_tick_lateness.py --seconds 30 --json tick-lateness.json
          { echo "### Tick clock, ${{ matrix.os }}, Python ${{ matrix.python }}"; echo '```'
            cat tick-lateness.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tick-lateness-${{ matrix.os }}-${{ matrix.python }}
          path: tick-lateness.json
