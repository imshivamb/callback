name: e2e

# The full end-to-end suite: real CLI, real calls against the reference agents,
# local speech models (downloaded and cached on first run). Takes 20+ minutes, so
# it runs only when started by hand from the Actions tab.

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CALLBACK_MODEL_DIR: ~/.cache/callback/models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: espeak-ng (for Kokoro TTS)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y espeak-ng
          else brew install espeak-ng; fi
      # Downloaded models only. The reference agent's phrase cache (models/agent-tts)
      # is left out on purpose, so every run measures the agent as a fresh machine does.
      - name: Restore speech models
        id: models
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/callback/models/kokoro
            ~/.cache/huggingface
          key: speech-models-v2
      - run: uv sync --python 3.12 --locked --extra local
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - name: End-to-end tests (real CLI, real calls, local models)
        run: uv run pytest -rs --basetemp=e2e-tmp
      - name: Save speech models (also when tests fail)
        if: always() && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/callback/models/kokoro
            ~/.cache/huggingface
          key: speech-models-v2
      - name: Keep the evidence (results, event logs, reports, agent logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.os }}
          path: |
            e2e-tmp/**/results.json
            e2e-tmp/**/events.jsonl
            e2e-tmp/**/report.html
            .callback/e2e-agent-logs/
          include-hidden-files: true  # real-call runs live under .callback/
          if-no-files-found: ignore
          retention-days: 14
