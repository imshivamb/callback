name: e2e

# The full end-to-end suite: real CLI, real calls against the reference agents,
# local speech models (downloaded and cached on first run). Takes 20+ minutes, so
# it runs only when started by hand from the Actions tab.

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Informational on GitHub runners, on both OSes: shared 3-core runners are too slow
    # and noisy for the real-call suite to pass reliably (see docs/testing.md). Results,
    # reports and agent logs are always kept as artifacts; failures don't turn the
    # workflow red. The required gate is the fast `ci` workflow; this suite is run
    # locally before a release. On macOS no latency limit even separates the agents
    # (good up to 3.56 s, buggy from 2.43 s).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CALLBACK_MODEL_DIR: ~/.cache/callback/models
      # Shared runners synthesise speech 2-3x slower than a laptop. Measured on Ubuntu
      # runners (run 36463568916): good agent reply-delay p95 0.95-1.70 s, buggy agent
      # 2.25-2.73 s. 2.0 s separates them. The real target stays 1.5 s; runs record the
      # loosened limit in results.json and show it in the report.
      CALLBACK_CI_LATENCY_LIMIT_S: "2.0"
      # The caller's own chaos timing drifts on busy runners: worst per call measured
      # 0.86 s on Ubuntu (7 of 27 calls over 0.1 s), 1.63 s on macOS, vs 4 ms on a
      # laptop. Informational in results; recorded like the latency limit.
      CALLBACK_CI_DRIFT_LIMIT_S: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: espeak-ng (for Kokoro TTS)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y espeak-ng
          else brew install espeak-ng; fi
      # Downloaded models only. The reference agent's phrase cache (models/agent-tts)
      # is left out on purpose, so every run measures the agent as a fresh machine does.
      - name: Restore speech models
        id: models
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/callback/models/kokoro
            ~/.cache/huggingface
          key: speech-models-v2
      - run: uv sync --python 3.12 --locked --extra local
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - name: End-to-end tests (real CLI, real calls, local models)
        run: uv run pytest -rs --basetemp=e2e-tmp
      - name: Save speech models (also when tests fail)
        if: always() && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/callback/models/kokoro
            ~/.cache/huggingface
          key: speech-models-v2
      - name: Keep the evidence (results, event logs, reports, agent logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.os }}
          path: |
            e2e-tmp/**/results.json
            e2e-tmp/**/events.jsonl
            e2e-tmp/**/report.html
            .callback/e2e-agent-logs/
          include-hidden-files: true  # real-call runs live under .callback/
          if-no-files-found: ignore
          retention-days: 14
