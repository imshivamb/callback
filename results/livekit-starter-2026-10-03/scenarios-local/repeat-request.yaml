# The caller did not catch the agent's last answer and asks for it again.
id: repeat-request
agent: livekit-starter
trials: 5
max_duration_s: 150
caller:
  persona: "Priya, on a bad speaker"
  goal: "Plan a quick vegetarian dinner for four"
  voice: male_us_1
  speaks_first: true
  script:
    - "Hi, can you help me plan a simple dinner for four people tonight?"
    - "I would like something vegetarian that takes under thirty minutes."
    - "Okay, and what do I need to buy from the shop?"
    - "That sounds good. Thanks, that's all. Bye."
chaos:
  events:
    - repeat_request: {on: caller_turn, turn: 3}
