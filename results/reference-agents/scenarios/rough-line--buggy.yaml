# A noisy street and a bad mobile line: the conversation should still complete.
id: rough-line--buggy
trials: 5
agent: restaurant-buggy
max_duration_s: 150
caller:
  persona: "Arjun, walking down a busy street"
  goal: "Move booking DX7Q2 to Saturday evening"
  voice: male_us_1
  script:
    - "Hi, I need to move my booking to Saturday."
    - "It's D X 7 Q 2."
    - "Anytime between seven and nine is fine."
    - "Seven thirty works."
    - "Yes please."
    - "No, that's all. Thanks, bye."
chaos:
  noise: {bed: street, snr_db: 15}
  events:
    - packet_loss: {pct: 3, from_s: 10, to_s: 30}
    - jitter: {ms: 60, from_s: 30, to_s: 40}
